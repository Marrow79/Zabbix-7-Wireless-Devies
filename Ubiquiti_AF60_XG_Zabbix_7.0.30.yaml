zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: aea64e5684c54fcfb4af0e4989a7f98b
    template: Ubiquiti airFiber 60 XG by SNMP
    name: Ubiquiti airFiber 60 XG by SNMP
    description: 'Zabbix 7.0.30 template for Ubiquiti airFiber 60 XG (AF60-XG). Role: PtP. SNMP assessment: Conditional. AF60-LR
      current tech specs explicitly list SNMP; UI-AF60-MIB provides AF60 objects. For XR/XG, verify firmware exposes the same
      SNMP service/MIB.  SNMP credentials/interface are configured at the Zabbix host, not in this template.'
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 414c95f52c4246f3ac82fced65f89b58
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      delay: 1m
      history: 7d
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 51dad821cb6d486fb0c8ed76bd4d5342
        expression: max(/Ubiquiti airFiber 60 XG by SNMP/icmpping,#3)=0
        name: 'airFiber 60 XG: Unavailable by ICMP ping'
        priority: HIGH
        description: Three consecutive ICMP checks failed.
        tags:
        - tag: scope
          value: availability
    - uuid: 742fe98081414732949d22bfce559eb9
      name: ICMP packet loss
      type: SIMPLE
      key: icmppingloss
      delay: 1m
      value_type: FLOAT
      units: '%'
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 15ce53f9bdef4cd480246f1536448f44
        expression: min(/Ubiquiti airFiber 60 XG by SNMP/icmppingloss,5m)>{$ICMP.LOSS.WARN} and min(/Ubiquiti airFiber 60
          XG by SNMP/icmppingloss,5m)<100
        name: 'airFiber 60 XG: High ICMP packet loss'
        priority: WARNING
        description: Packet loss exceeded the warning threshold for 5 minutes.
        tags:
        - tag: scope
          value: performance
    - uuid: a9c984e7526b4f559707894df89658e6
      name: ICMP response time
      type: SIMPLE
      key: icmppingsec
      delay: 1m
      value_type: FLOAT
      units: s
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: de2825a208e8446f89a0d956a50d5369
        expression: avg(/Ubiquiti airFiber 60 XG by SNMP/icmppingsec,5m)>{$ICMP.RTT.WARN}
        name: 'airFiber 60 XG: High ICMP response time'
        priority: WARNING
        description: Average round-trip time exceeded threshold for 5 minutes.
        tags:
        - tag: scope
          value: performance
    - uuid: 6a31440c41cd485c8d3db8c7cc3b6e70
      name: SNMP network uptime
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.3.0]
      key: uisp.system.uptime
      delay: 1m
      units: uptime
      description: sysUpTime (TimeTicks / 100); measures SNMP agent uptime, not guaranteed hardware uptime.
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 7a25db1880e9471ba6561940e9b99396
        expression: nodata(/Ubiquiti airFiber 60 XG by SNMP/uisp.system.uptime,15m)=1 and last(/Ubiquiti airFiber 60 XG by
          SNMP/icmpping)=1
        name: 'airFiber 60 XG: SNMP stops responding while ping succeeds'
        priority: AVERAGE
        description: Device replies to ping but sysUpTime polling has had no data for 15 minutes; check SNMP credentials/firewall.
        tags:
        - tag: scope
          value: availability
    - uuid: 07d4bd07ac39412ca99aa4c75f9286fb
      name: SNMP system description
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.1.0]
      key: uisp.system.description
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: d1f4726d868841449e643b2bc8052e2f
      name: SNMP system object ID
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.2.0]
      key: uisp.system.objectid
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 82d77130b4f94599a47be25cacc520f4
      name: SNMP system name
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.5.0]
      key: uisp.system.name
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 71df4f0361a24cb7821e22a6030547af
      name: SNMP system location
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.6.0]
      key: uisp.system.location
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 5efc64227c86487c8c5c8d77d5cdf97b
      name: SNMP system contact
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.4.0]
      key: uisp.system.contact
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 6dbf564c2b1340f8b9bf7f44b52e0913
      name: AF60/Wave device model
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.2.2.0]
      key: uisp.af60.model
      delay: 10m
      value_type: CHAR
      tags:
      - tag: component
        value: wireless
    - uuid: 2a75203df6fe4712a34fc2db16e177a0
      name: AF60/Wave firmware version
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.2.4.0]
      key: uisp.af60.firmware
      delay: 10m
      value_type: CHAR
      tags:
      - tag: component
        value: wireless
    - uuid: 4b6e570214d64233ad429e1dc63d9fb8
      name: AF60/Wave memory usage
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.2.5.0]
      key: uisp.af60.memory
      delay: 2m
      units: '%'
      tags:
      - tag: component
        value: wireless
    - uuid: 23285b9d1b124b1ea5f75dc1c3d5138e
      name: AF60/Wave CPU usage
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.2.6.0]
      key: uisp.af60.cpu
      delay: 2m
      units: '%'
      tags:
      - tag: component
        value: wireless
    - uuid: a52ed0fb23f5428a83de0cc617fab5c3
      name: AF60/Wave configured frequency
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.1.2.0]
      key: uisp.af60.frequency
      delay: 2m
      units: MHz
      tags:
      - tag: component
        value: wireless
    discovery_rules:
    - uuid: e83a1bb9ada94a65bc9bfa55bd0fad66
      name: Network interface discovery (IF-MIB)
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFNAME},1.3.6.1.2.1.2.2.1.2,{#IFADMIN},1.3.6.1.2.1.2.2.1.7]
      key: uisp.if.discovery
      delay: 1h
      description: Standard IF-MIB/IF-X-MIB discovery. High-capacity 64-bit counters may be unsupported on older devices;
        classic 32-bit counters are included as fallback.
      filter:
        conditions:
        - macro: '{#IFNAME}'
          value: '{$UISP.IF.MATCHES}'
      item_prototypes:
      - uuid: 12e684a772b54783baf8fcb902e71453
        name: 'Interface {#IFNAME}: Operational status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]
        key: uisp.if.status[{#SNMPINDEX}]
        delay: 2m
        valuemap:
          name: IF-MIB ifOperStatus
        tags:
        - tag: component
          value: network
      - uuid: bfe1dfc52808416f97e90d0396957273
        name: 'Interface {#IFNAME}: Admin status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}]
        key: uisp.if.admin[{#SNMPINDEX}]
        delay: 5m
        valuemap:
          name: IF-MIB ifAdminStatus
        tags:
        - tag: component
          value: network
      - uuid: 9974f411dc26440c9a95b8def6a974f0
        name: 'Interface {#IFNAME}: Incoming traffic (64-bit)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}]
        key: uisp.if.hc.in[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: 64-bit IF-MIB high-capacity octet counter, suitable for multi-gigabit uplinks.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 7ce5790194d44453853a41b84aac8a11
        name: 'Interface {#IFNAME}: Outgoing traffic (64-bit)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}]
        key: uisp.if.hc.out[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: 64-bit IF-MIB high-capacity octet counter, suitable for multi-gigabit uplinks.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: ba79204b9ffd4cb4a5f9742f1aa44daf
        name: 'Interface {#IFNAME}: Incoming traffic (32-bit fallback)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.10.{#SNMPINDEX}]
        key: uisp.if.legacy.in[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: Counter converted from bytes/s to bits/s. 32-bit counters may wrap at high throughput.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 3426f94932764c4f81e833571773d644
        name: 'Interface {#IFNAME}: Outgoing traffic (32-bit fallback)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.16.{#SNMPINDEX}]
        key: uisp.if.legacy.out[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: Counter converted from bytes/s to bits/s. 32-bit counters may wrap at high throughput.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 064f19f2d595494f9084b88c29adc6a6
        name: 'Interface {#IFNAME}: Input errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}]
        key: uisp.if.in.errors[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: errors
      - uuid: f1d395906917411e934900ae79eaf65f
        name: 'Interface {#IFNAME}: Output errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}]
        key: uisp.if.out.errors[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: errors
      - uuid: 2ee7c76000084853983c06fd8f14e4ce
        name: 'Interface {#IFNAME}: Input discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}]
        key: uisp.if.in.discards[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: errors
      - uuid: 999945e64754442c954a980642881e9e
        name: 'Interface {#IFNAME}: Output discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}]
        key: uisp.if.out.discards[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: errors
      graph_prototypes:
      - uuid: 31b09dcc18e14ff6bbd3a5c227c64c45
        name: 'Interface {#IFNAME}: Traffic (64-bit)'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti airFiber 60 XG by SNMP
            key: uisp.if.hc.in[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti airFiber 60 XG by SNMP
            key: uisp.if.hc.out[{#SNMPINDEX}]
      - uuid: 8a0bca5fbe7a4948937c0d909bddd0a4
        name: 'Interface {#IFNAME}: Traffic (32-bit fallback)'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti airFiber 60 XG by SNMP
            key: uisp.if.legacy.in[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti airFiber 60 XG by SNMP
            key: uisp.if.legacy.out[{#SNMPINDEX}]
      - uuid: ff7e83a32f414480a251bed246b335e1
        name: 'Interface {#IFNAME}: Errors and discards'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti airFiber 60 XG by SNMP
            key: uisp.if.in.errors[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti airFiber 60 XG by SNMP
            key: uisp.if.out.errors[{#SNMPINDEX}]
        - sortorder: '2'
          color: 1A7BC5
          item:
            host: Ubiquiti airFiber 60 XG by SNMP
            key: uisp.if.in.discards[{#SNMPINDEX}]
        - sortorder: '3'
          color: 6C59DC
          item:
            host: Ubiquiti airFiber 60 XG by SNMP
            key: uisp.if.out.discards[{#SNMPINDEX}]
      trigger_prototypes:
      - uuid: aa8257eb64e946acb4967fe7b33b9dfa
        expression: '{$UISP.IF.ALERT:"{#IFNAME}"}=1 and last(/Ubiquiti airFiber 60 XG by SNMP/uisp.if.status[{#SNMPINDEX}])=2'
        name: 'airFiber 60 XG: Interface {#IFNAME} is down'
        priority: AVERAGE
        description: Opt-in interface alert. Set contextual {$UISP.IF.ALERT:"<interface>"}=1 for the intended physical uplink
          only.
        tags:
        - tag: scope
          value: availability
    - uuid: ba4093ad6fcf43bca0a0865c8aa35a4d
      name: AF60/Wave remote station discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#REMOTE},1.3.6.1.4.1.41112.1.11.1.3.1.14]
      key: uisp.af60.station.discovery
      delay: 10m
      description: UI-AF60-MIB remote station table. On Wave models the private MIB may be partial or firmware-dependent;
        disable this rule if unsupported.
      item_prototypes:
      - uuid: 7b34caca30834acc911d6e27d4a446be
        name: 'AF60/Wave {#REMOTE}: Local RSSI'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.3.1.3.{#SNMPINDEX}]
        key: uisp.af60.rssi[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: dBm
      - uuid: 11bdbbfd024b45498c53a3a8a347b4ca
        name: 'AF60/Wave {#REMOTE}: Local SNR'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.3.1.4.{#SNMPINDEX}]
        key: uisp.af60.snr[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: dB
      - uuid: 33c1216ff5a04d199feb3612645a750e
        name: 'AF60/Wave {#REMOTE}: TX capacity'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.3.1.7.{#SNMPINDEX}]
        key: uisp.af60.txcap[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: Kbps
      - uuid: dc70fa4751fa437d883f78e0207d84da
        name: 'AF60/Wave {#REMOTE}: RX capacity'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.3.1.8.{#SNMPINDEX}]
        key: uisp.af60.rxcap[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: Kbps
      - uuid: c14a8b13923f46eebf716e15d167ef93
        name: 'AF60/Wave {#REMOTE}: TX throughput'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.3.1.11.{#SNMPINDEX}]
        key: uisp.af60.txthrough[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: Kbps
      - uuid: fbe94a2afec44bf1ae5d4c376a600b78
        name: 'AF60/Wave {#REMOTE}: RX throughput'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.3.1.12.{#SNMPINDEX}]
        key: uisp.af60.rxthrough[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: Kbps
      - uuid: e39f68669cf740fd8b395cba5d87864b
        name: 'AF60/Wave {#REMOTE}: Distance'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.3.1.15.{#SNMPINDEX}]
        key: uisp.af60.distance[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: m
      - uuid: 0f8b37ab5af34eb6b0b4c212aa1dfda1
        name: 'AF60/Wave {#REMOTE}: Remote RSSI'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.3.1.18.{#SNMPINDEX}]
        key: uisp.af60.remote.rssi[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: dBm
      graph_prototypes:
      - uuid: 679283c77daa49d0becb9e28952d6e20
        name: 'AF60/Wave {#REMOTE}: Capacity'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti airFiber 60 XG by SNMP
            key: uisp.af60.txcap[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti airFiber 60 XG by SNMP
            key: uisp.af60.rxcap[{#SNMPINDEX}]
      - uuid: a665e7ad8ffe4dc5aee103b975e20fd9
        name: 'AF60/Wave {#REMOTE}: Throughput'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti airFiber 60 XG by SNMP
            key: uisp.af60.txthrough[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti airFiber 60 XG by SNMP
            key: uisp.af60.rxthrough[{#SNMPINDEX}]
      - uuid: 1df2e7eadae24f4e92f09bf6c6abe15f
        name: 'AF60/Wave {#REMOTE}: Signal'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti airFiber 60 XG by SNMP
            key: uisp.af60.rssi[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti airFiber 60 XG by SNMP
            key: uisp.af60.remote.rssi[{#SNMPINDEX}]
    tags:
    - tag: vendor
      value: Ubiquiti
    - tag: family
      value: airFiber 60
    - tag: model
      value: AF60-XG
    - tag: role
      value: PtP
    macros:
    - macro: '{$ICMP.LOSS.WARN}'
      value: '20'
      description: Packet-loss percent threshold
    - macro: '{$ICMP.RTT.WARN}'
      value: '0.15'
      description: Round-trip time threshold (seconds)
    - macro: '{$UISP.IF.MATCHES}'
      value: .*
      description: Regex filter for interface descriptions
    - macro: '{$UISP.IF.ALERT}'
      value: '0'
      description: Global interface-down alert is disabled. Use contextual {$UISP.IF.ALERT:"<physical-interface>"}=1 to enable
        only for intended ports.
    - macro: '{$UISP.RF.ALERT}'
      value: '0'
      description: Enable RF-link-down trigger only after confirming the private MIB/profile works on this device/firmware.
    valuemaps:
    - uuid: 873a68b13a384dd8b41a04c8ffac858c
      name: IF-MIB ifOperStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
      - value: '4'
        newvalue: unknown
      - value: '5'
        newvalue: dormant
      - value: '6'
        newvalue: notPresent
      - value: '7'
        newvalue: lowerLayerDown
    - uuid: c0286761731f440a99314e95a0a2f5f5
      name: IF-MIB ifAdminStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
  graphs:
  - uuid: f86e17b883d649489c327347b1407abf
    name: 'airFiber 60 XG: ICMP latency'
    graph_items:
    - color: 199C0D
      item:
        host: Ubiquiti airFiber 60 XG by SNMP
        key: icmppingsec
  - uuid: d7cd5743a1d14cf99e048b71d0114c63
    name: 'airFiber 60 XG: ICMP packet loss'
    graph_items:
    - color: 199C0D
      item:
        host: Ubiquiti airFiber 60 XG by SNMP
        key: icmppingloss
  - uuid: 77f4f5aa256141c8876eab15ae5cb965
    name: 'airFiber 60 XG: SNMP agent uptime'
    graph_items:
    - color: 199C0D
      item:
        host: Ubiquiti airFiber 60 XG by SNMP
        key: uisp.system.uptime
