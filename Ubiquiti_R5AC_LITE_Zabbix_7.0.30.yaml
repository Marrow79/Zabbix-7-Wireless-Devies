zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: bd393edcf6154def8b13aca2b48a8776
    template: Ubiquiti Rocket AC Lite by SNMP
    name: Ubiquiti Rocket AC Lite by SNMP
    description: 'Zabbix 7.0.30 template for Ubiquiti Rocket AC Lite (R5AC-LITE). Role: PtP/PtMP base station. SNMP assessment:
      Yes. Ubiquiti states all airMAX devices support SNMPv1 read access; UBNT-AirMAX-MIB used for wireless metrics. Private
      airMAX MIB support can differ by airOS generation; unsupported individual OIDs will become unsupported items, not block
      import. SNMP credentials/interface are configured at the Zabbix host, not in this template.'
    groups:
    - name: Templates/Network devices
    items:
    - uuid: a0d0c1ad01aa42928caf71387e9dd8bf
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      delay: 1m
      history: 7d
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: f2e293f7716645618f5926634fc5fa60
        expression: max(/Ubiquiti Rocket AC Lite by SNMP/icmpping,#3)=0
        name: 'Rocket AC Lite: Unavailable by ICMP ping'
        priority: HIGH
        description: Three consecutive ICMP checks failed.
        tags:
        - tag: scope
          value: availability
    - uuid: f708a6b521a44faca356d1b261e3c40c
      name: ICMP packet loss
      type: SIMPLE
      key: icmppingloss
      delay: 1m
      value_type: FLOAT
      units: '%'
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 620b3d3fcec8443eb80fa35a0b1e57ab
        expression: min(/Ubiquiti Rocket AC Lite by SNMP/icmppingloss,5m)>{$ICMP.LOSS.WARN} and min(/Ubiquiti Rocket AC Lite
          by SNMP/icmppingloss,5m)<100
        name: 'Rocket AC Lite: High ICMP packet loss'
        priority: WARNING
        description: Packet loss exceeded the warning threshold for 5 minutes.
        tags:
        - tag: scope
          value: performance
    - uuid: 25b9bee0637048b98273d40cc77b04a2
      name: ICMP response time
      type: SIMPLE
      key: icmppingsec
      delay: 1m
      value_type: FLOAT
      units: s
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: b159ee4749124a28a7f34242a16b0033
        expression: avg(/Ubiquiti Rocket AC Lite by SNMP/icmppingsec,5m)>{$ICMP.RTT.WARN}
        name: 'Rocket AC Lite: High ICMP response time'
        priority: WARNING
        description: Average round-trip time exceeded threshold for 5 minutes.
        tags:
        - tag: scope
          value: performance
    - uuid: b0b7aca63f6047a190398ebe1eb330c1
      name: SNMP network uptime
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.3.0]
      key: uisp.system.uptime
      delay: 1m
      units: uptime
      description: sysUpTime (TimeTicks / 100); measures SNMP agent uptime, not guaranteed hardware uptime.
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 7e58a05ca4b84c819dfd4d754d70fa93
        expression: nodata(/Ubiquiti Rocket AC Lite by SNMP/uisp.system.uptime,15m)=1 and last(/Ubiquiti Rocket AC Lite by
          SNMP/icmpping)=1
        name: 'Rocket AC Lite: SNMP stops responding while ping succeeds'
        priority: AVERAGE
        description: Device replies to ping but sysUpTime polling has had no data for 15 minutes; check SNMP credentials/firewall.
        tags:
        - tag: scope
          value: availability
    - uuid: 1878fd1d94b34382924b3fc6e1622193
      name: SNMP system description
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.1.0]
      key: uisp.system.description
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 65bcb43d897f42c3be18318c1c73afd5
      name: SNMP system object ID
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.2.0]
      key: uisp.system.objectid
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: d40cc0aa317f4c4e849e27f5ed02221b
      name: SNMP system name
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.5.0]
      key: uisp.system.name
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: f94fb0c9432845579128f6231a42a8a0
      name: SNMP system location
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.6.0]
      key: uisp.system.location
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: fa4a19d0f9144504ac19a2b6cf141f44
      name: SNMP system contact
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.4.0]
      key: uisp.system.contact
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    discovery_rules:
    - uuid: 8ca92d7e8d934b2fb88a989ee3eac3d4
      name: Network interface discovery (IF-MIB)
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFNAME},1.3.6.1.2.1.2.2.1.2,{#IFADMIN},1.3.6.1.2.1.2.2.1.7]
      key: uisp.if.discovery
      delay: 1h
      description: Standard IF-MIB/IF-X-MIB discovery. High-capacity 64-bit counters may be unsupported on older devices;
        classic 32-bit counters are included as fallback.
      filter:
        conditions:
        - macro: '{#IFNAME}'
          value: '{$UISP.IF.MATCHES}'
      item_prototypes:
      - uuid: b2bb17064a864b79bf0b1770c4b79d69
        name: 'Interface {#IFNAME}: Operational status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]
        key: uisp.if.status[{#SNMPINDEX}]
        delay: 2m
        valuemap:
          name: IF-MIB ifOperStatus
        tags:
        - tag: component
          value: network
      - uuid: a0a56a685d8d4df5bfd96a23908e922f
        name: 'Interface {#IFNAME}: Admin status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}]
        key: uisp.if.admin[{#SNMPINDEX}]
        delay: 5m
        valuemap:
          name: IF-MIB ifAdminStatus
        tags:
        - tag: component
          value: network
      - uuid: ddc6e8f39d094e0e9640fb2038fa6738
        name: 'Interface {#IFNAME}: Incoming traffic (64-bit)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}]
        key: uisp.if.hc.in[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: 64-bit IF-MIB high-capacity octet counter, suitable for multi-gigabit uplinks.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 809ae83c22ae43d399650ea218df87bb
        name: 'Interface {#IFNAME}: Outgoing traffic (64-bit)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}]
        key: uisp.if.hc.out[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: 64-bit IF-MIB high-capacity octet counter, suitable for multi-gigabit uplinks.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: ebdecc38bc5147bda352dcedaf15ac94
        name: 'Interface {#IFNAME}: Incoming traffic (32-bit fallback)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.10.{#SNMPINDEX}]
        key: uisp.if.legacy.in[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: Counter converted from bytes/s to bits/s. 32-bit counters may wrap at high throughput.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: d015ebf626ba43d290b8421899fc0dc0
        name: 'Interface {#IFNAME}: Outgoing traffic (32-bit fallback)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.16.{#SNMPINDEX}]
        key: uisp.if.legacy.out[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: Counter converted from bytes/s to bits/s. 32-bit counters may wrap at high throughput.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 6756a229fd514a29b7fccb15bf00db83
        name: 'Interface {#IFNAME}: Input errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}]
        key: uisp.if.in.errors[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: errors
      - uuid: 82629aac9ca14b65a0692aa67be5cd11
        name: 'Interface {#IFNAME}: Output errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}]
        key: uisp.if.out.errors[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: errors
      - uuid: 8bc63e7e79ea47c6a932b7e2c801f1b7
        name: 'Interface {#IFNAME}: Input discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}]
        key: uisp.if.in.discards[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: errors
      - uuid: a8da673db75e4158bb206f3c348c4721
        name: 'Interface {#IFNAME}: Output discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}]
        key: uisp.if.out.discards[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: errors
      graph_prototypes:
      - uuid: acb80615f82d4d37a9d07d2f92eb2556
        name: 'Interface {#IFNAME}: Traffic (64-bit)'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Rocket AC Lite by SNMP
            key: uisp.if.hc.in[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Rocket AC Lite by SNMP
            key: uisp.if.hc.out[{#SNMPINDEX}]
      - uuid: 00c048c493d341199b5e636f161767a8
        name: 'Interface {#IFNAME}: Traffic (32-bit fallback)'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Rocket AC Lite by SNMP
            key: uisp.if.legacy.in[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Rocket AC Lite by SNMP
            key: uisp.if.legacy.out[{#SNMPINDEX}]
      - uuid: 85b4efd78d694161af51a91a167cfcd1
        name: 'Interface {#IFNAME}: Errors and discards'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Rocket AC Lite by SNMP
            key: uisp.if.in.errors[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Rocket AC Lite by SNMP
            key: uisp.if.out.errors[{#SNMPINDEX}]
        - sortorder: '2'
          color: 1A7BC5
          item:
            host: Ubiquiti Rocket AC Lite by SNMP
            key: uisp.if.in.discards[{#SNMPINDEX}]
        - sortorder: '3'
          color: 6C59DC
          item:
            host: Ubiquiti Rocket AC Lite by SNMP
            key: uisp.if.out.discards[{#SNMPINDEX}]
      trigger_prototypes:
      - uuid: 15cb06a915534557ba16914d2f2e72f6
        expression: '{$UISP.IF.ALERT:"{#IFNAME}"}=1 and last(/Ubiquiti Rocket AC Lite by SNMP/uisp.if.status[{#SNMPINDEX}])=2'
        name: 'Rocket AC Lite: Interface {#IFNAME} is down'
        priority: AVERAGE
        description: Opt-in interface alert. Set contextual {$UISP.IF.ALERT:"<interface>"}=1 for the intended physical uplink
          only.
        tags:
        - tag: scope
          value: availability
    - uuid: 982ad4bcebd94de0ae76fb9745f4b503
      name: airMAX wireless interface discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SSID},1.3.6.1.4.1.41112.1.4.5.1.2]
      key: uisp.airmax.wireless.discovery
      delay: 10m
      description: UBNT-AirMAX-MIB wireless status table. Ubiquiti documents ubntWlStatSignal as .1.3.6.1.4.1.41112.1.4.5.1.5.
      item_prototypes:
      - uuid: baabc0af47bc4000a827ee9570abb793
        name: 'airMAX {#SSID}: Signal'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.5.1.5.{#SNMPINDEX}]
        key: uisp.airmax.signal[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: dBm
      - uuid: d0fc09dec06449c49773a66377efe751
        name: 'airMAX {#SSID}: RSSI'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.5.1.6.{#SNMPINDEX}]
        key: uisp.airmax.rssi[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: dBm
      - uuid: c35f3f2b90614f16a1bfbba293e70773
        name: 'airMAX {#SSID}: CCQ'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.5.1.7.{#SNMPINDEX}]
        key: uisp.airmax.ccq[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: '%'
      - uuid: af752537e1d54292a262224eba080bbc
        name: 'airMAX {#SSID}: Noise floor'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.5.1.8.{#SNMPINDEX}]
        key: uisp.airmax.noise[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: dBm
      - uuid: 2d60ea3993b0422da2ec9a9dddaf995e
        name: 'airMAX {#SSID}: TX rate'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.5.1.9.{#SNMPINDEX}]
        key: uisp.airmax.txrate[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
      - uuid: 2c519af8fbee42c3870ded3da1a81207
        name: 'airMAX {#SSID}: RX rate'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.5.1.10.{#SNMPINDEX}]
        key: uisp.airmax.rxrate[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
      - uuid: 7b7b688a14414075897c157a3c393424
        name: 'airMAX {#SSID}: Station count'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.5.1.15.{#SNMPINDEX}]
        key: uisp.airmax.stations[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
      graph_prototypes:
      - uuid: 75358d9e7c974e318ee3f058a6494895
        name: 'airMAX {#SSID}: RF signal'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Rocket AC Lite by SNMP
            key: uisp.airmax.signal[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Rocket AC Lite by SNMP
            key: uisp.airmax.noise[{#SNMPINDEX}]
      - uuid: 7d6565500ae9450c87e352f6a89e0195
        name: 'airMAX {#SSID}: Link rates'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Rocket AC Lite by SNMP
            key: uisp.airmax.txrate[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Rocket AC Lite by SNMP
            key: uisp.airmax.rxrate[{#SNMPINDEX}]
    - uuid: c3bb6c35d3124653ae375dd13b42e4e8
      name: airMAX quality discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#AMQ},1.3.6.1.4.1.41112.1.4.6.1.3]
      key: uisp.airmax.quality.discovery
      delay: 10m
      item_prototypes:
      - uuid: 28168bc9e18e450ca021816821a1e1da
        name: airMAX quality
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.6.1.3.{#SNMPINDEX}]
        key: uisp.airmax.quality[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: '%'
      - uuid: 0a7446839aaf45aebfced511c985ea8f
        name: airMAX capacity
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.6.1.4.{#SNMPINDEX}]
        key: uisp.airmax.capacity[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: '%'
      - uuid: c81f4201b9fd4b7894a7e61697ef6a7f
        name: airMAX airtime
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.6.1.7.{#SNMPINDEX}]
        key: uisp.airmax.airtime[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: '%'
        preprocessing:
        - type: MULTIPLIER
          parameters:
          - '0.1'
      graph_prototypes:
      - uuid: 4bcb95d6940849d5b4ee503e94ed215a
        name: airMAX quality / capacity
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Rocket AC Lite by SNMP
            key: uisp.airmax.quality[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Rocket AC Lite by SNMP
            key: uisp.airmax.capacity[{#SNMPINDEX}]
        - sortorder: '2'
          color: 1A7BC5
          item:
            host: Ubiquiti Rocket AC Lite by SNMP
            key: uisp.airmax.airtime[{#SNMPINDEX}]
    tags:
    - tag: vendor
      value: Ubiquiti
    - tag: family
      value: airMAX
    - tag: model
      value: R5AC-LITE
    - tag: role
      value: PtP/PtMP base station
    macros:
    - macro: '{$ICMP.LOSS.WARN}'
      value: '20'
      description: Packet-loss percent threshold
    - macro: '{$ICMP.RTT.WARN}'
      value: '0.15'
      description: Round-trip time threshold (seconds)
    - macro: '{$UISP.IF.MATCHES}'
      value: .*
      description: Regex filter for interface descriptions
    - macro: '{$UISP.IF.ALERT}'
      value: '0'
      description: Global interface-down alert is disabled. Use contextual {$UISP.IF.ALERT:"<physical-interface>"}=1 to enable
        only for intended ports.
    - macro: '{$UISP.RF.ALERT}'
      value: '0'
      description: Enable RF-link-down trigger only after confirming the private MIB/profile works on this device/firmware.
    valuemaps:
    - uuid: 4d06f3d5fbf74db5ae5207f45776ac30
      name: IF-MIB ifOperStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
      - value: '4'
        newvalue: unknown
      - value: '5'
        newvalue: dormant
      - value: '6'
        newvalue: notPresent
      - value: '7'
        newvalue: lowerLayerDown
    - uuid: 665cfbc3c6cc4768a6d3368fe745997a
      name: IF-MIB ifAdminStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
  graphs:
  - uuid: 343c84492be046ada8cc903a3753b7a8
    name: 'Rocket AC Lite: ICMP latency'
    graph_items:
    - color: 199C0D
      item:
        host: Ubiquiti Rocket AC Lite by SNMP
        key: icmppingsec
  - uuid: a782d36d5e3a4856a8a060054e77025f
    name: 'Rocket AC Lite: ICMP packet loss'
    graph_items:
    - color: 199C0D
      item:
        host: Ubiquiti Rocket AC Lite by SNMP
        key: icmppingloss
  - uuid: 8ff1ce3c9d7541229bb8af6b8ef8c622
    name: 'Rocket AC Lite: SNMP agent uptime'
    graph_items:
    - color: 199C0D
      item:
        host: Ubiquiti Rocket AC Lite by SNMP
        key: uisp.system.uptime
