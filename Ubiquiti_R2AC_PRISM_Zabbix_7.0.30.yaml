zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: df1aef347def4c7a9302624d488fc856
    template: Ubiquiti Rocket Prism 2AC by SNMP
    name: Ubiquiti Rocket Prism 2AC by SNMP
    description: 'Zabbix 7.0.30 template for Ubiquiti Rocket Prism 2AC (R2AC-PRISM). Role: PtP/PtMP base station. SNMP assessment:
      Yes. Ubiquiti states all airMAX devices support SNMPv1 read access; UBNT-AirMAX-MIB used for wireless metrics. Private
      airMAX MIB support can differ by airOS generation; unsupported individual OIDs will become unsupported items, not block
      import. SNMP credentials/interface are configured at the Zabbix host, not in this template.'
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 6a533793a4b749fb898c99fd890adb0c
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      delay: 1m
      history: 7d
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 66eb0c4be1ba420fa35ed3aa6399f386
        expression: max(/Ubiquiti Rocket Prism 2AC by SNMP/icmpping,#3)=0
        name: 'Rocket Prism 2AC: Unavailable by ICMP ping'
        priority: HIGH
        description: Three consecutive ICMP checks failed.
        tags:
        - tag: scope
          value: availability
    - uuid: 1172548f2c234f3d8304e2c7289923d2
      name: ICMP packet loss
      type: SIMPLE
      key: icmppingloss
      delay: 1m
      value_type: FLOAT
      units: '%'
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: e685c13553424a9d998308768a294b32
        expression: min(/Ubiquiti Rocket Prism 2AC by SNMP/icmppingloss,5m)>{$ICMP.LOSS.WARN} and min(/Ubiquiti Rocket Prism
          2AC by SNMP/icmppingloss,5m)<100
        name: 'Rocket Prism 2AC: High ICMP packet loss'
        priority: WARNING
        description: Packet loss exceeded the warning threshold for 5 minutes.
        tags:
        - tag: scope
          value: performance
    - uuid: ea22524325cb467aac771c537404f6a6
      name: ICMP response time
      type: SIMPLE
      key: icmppingsec
      delay: 1m
      value_type: FLOAT
      units: s
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 2d53a63d9dab4942bfb2f10ca5dd10a2
        expression: avg(/Ubiquiti Rocket Prism 2AC by SNMP/icmppingsec,5m)>{$ICMP.RTT.WARN}
        name: 'Rocket Prism 2AC: High ICMP response time'
        priority: WARNING
        description: Average round-trip time exceeded threshold for 5 minutes.
        tags:
        - tag: scope
          value: performance
    - uuid: 63c1c691b9ea4247aadfee1873b83368
      name: SNMP network uptime
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.3.0]
      key: uisp.system.uptime
      delay: 1m
      units: uptime
      description: sysUpTime (TimeTicks / 100); measures SNMP agent uptime, not guaranteed hardware uptime.
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: a02a26e7133d433ebd72dcffec9b4777
        expression: nodata(/Ubiquiti Rocket Prism 2AC by SNMP/uisp.system.uptime,15m)=1 and last(/Ubiquiti Rocket Prism 2AC
          by SNMP/icmpping)=1
        name: 'Rocket Prism 2AC: SNMP stops responding while ping succeeds'
        priority: AVERAGE
        description: Device replies to ping but sysUpTime polling has had no data for 15 minutes; check SNMP credentials/firewall.
        tags:
        - tag: scope
          value: availability
    - uuid: 4016067d5a914655a98b9439aa9c3b63
      name: SNMP system description
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.1.0]
      key: uisp.system.description
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 311b853c202f45e39c36c6c10381545e
      name: SNMP system object ID
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.2.0]
      key: uisp.system.objectid
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 81d2dd6f00374bd0b02cd39df7dc3cbd
      name: SNMP system name
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.5.0]
      key: uisp.system.name
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 4da9bba987c34cf3be8c7fa82542edac
      name: SNMP system location
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.6.0]
      key: uisp.system.location
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 91b7ef59c6144323b2b0dc93f9850355
      name: SNMP system contact
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.4.0]
      key: uisp.system.contact
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    discovery_rules:
    - uuid: 4b09d96cf7944d6ebf73652fde831e0a
      name: Network interface discovery (IF-MIB)
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFNAME},1.3.6.1.2.1.2.2.1.2,{#IFADMIN},1.3.6.1.2.1.2.2.1.7]
      key: uisp.if.discovery
      delay: 1h
      description: Standard IF-MIB/IF-X-MIB discovery. High-capacity 64-bit counters may be unsupported on older devices;
        classic 32-bit counters are included as fallback.
      filter:
        conditions:
        - macro: '{#IFNAME}'
          value: '{$UISP.IF.MATCHES}'
      item_prototypes:
      - uuid: 5f43974acf574a26907e75387e94524d
        name: 'Interface {#IFNAME}: Operational status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]
        key: uisp.if.status[{#SNMPINDEX}]
        delay: 2m
        valuemap:
          name: IF-MIB ifOperStatus
        tags:
        - tag: component
          value: network
      - uuid: 4c9c610a7d564807996a834a49391cad
        name: 'Interface {#IFNAME}: Admin status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}]
        key: uisp.if.admin[{#SNMPINDEX}]
        delay: 5m
        valuemap:
          name: IF-MIB ifAdminStatus
        tags:
        - tag: component
          value: network
      - uuid: c9c5c6d36e4947c7bbb3edb2e8c50cd2
        name: 'Interface {#IFNAME}: Incoming traffic (64-bit)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}]
        key: uisp.if.hc.in[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: 64-bit IF-MIB high-capacity octet counter, suitable for multi-gigabit uplinks.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 4f09addacdd544feb356db8d6ab05691
        name: 'Interface {#IFNAME}: Outgoing traffic (64-bit)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}]
        key: uisp.if.hc.out[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: 64-bit IF-MIB high-capacity octet counter, suitable for multi-gigabit uplinks.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 9bef8fe2af7c449591f07f926d0aac5d
        name: 'Interface {#IFNAME}: Incoming traffic (32-bit fallback)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.10.{#SNMPINDEX}]
        key: uisp.if.legacy.in[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: Counter converted from bytes/s to bits/s. 32-bit counters may wrap at high throughput.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: e61dfe8b57b942f39c98e7559667a344
        name: 'Interface {#IFNAME}: Outgoing traffic (32-bit fallback)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.16.{#SNMPINDEX}]
        key: uisp.if.legacy.out[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: Counter converted from bytes/s to bits/s. 32-bit counters may wrap at high throughput.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 9134e27c1c9542acb9caa907eb3e75a7
        name: 'Interface {#IFNAME}: Input errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}]
        key: uisp.if.in.errors[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: errors
      - uuid: e8290f9d5a00443fa8696d632fcb1c08
        name: 'Interface {#IFNAME}: Output errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}]
        key: uisp.if.out.errors[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: errors
      - uuid: 8efd96e3d6fc48b68483741b57ad07bb
        name: 'Interface {#IFNAME}: Input discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}]
        key: uisp.if.in.discards[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: errors
      - uuid: effdf1eaaf034137a7e7d9bb947b4a5c
        name: 'Interface {#IFNAME}: Output discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}]
        key: uisp.if.out.discards[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: errors
      graph_prototypes:
      - uuid: 76f2cf08d3214e4ea0519711b1b5519f
        name: 'Interface {#IFNAME}: Traffic (64-bit)'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Rocket Prism 2AC by SNMP
            key: uisp.if.hc.in[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Rocket Prism 2AC by SNMP
            key: uisp.if.hc.out[{#SNMPINDEX}]
      - uuid: d353565f6eec42bda251f8b35c5dcf79
        name: 'Interface {#IFNAME}: Traffic (32-bit fallback)'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Rocket Prism 2AC by SNMP
            key: uisp.if.legacy.in[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Rocket Prism 2AC by SNMP
            key: uisp.if.legacy.out[{#SNMPINDEX}]
      - uuid: d375973e0ecb49b786af0960468d6b54
        name: 'Interface {#IFNAME}: Errors and discards'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Rocket Prism 2AC by SNMP
            key: uisp.if.in.errors[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Rocket Prism 2AC by SNMP
            key: uisp.if.out.errors[{#SNMPINDEX}]
        - sortorder: '2'
          color: 1A7BC5
          item:
            host: Ubiquiti Rocket Prism 2AC by SNMP
            key: uisp.if.in.discards[{#SNMPINDEX}]
        - sortorder: '3'
          color: 6C59DC
          item:
            host: Ubiquiti Rocket Prism 2AC by SNMP
            key: uisp.if.out.discards[{#SNMPINDEX}]
      trigger_prototypes:
      - uuid: 5d1363fad59c47b2b4fab935e0f517bb
        expression: '{$UISP.IF.ALERT:"{#IFNAME}"}=1 and last(/Ubiquiti Rocket Prism 2AC by SNMP/uisp.if.status[{#SNMPINDEX}])=2'
        name: 'Rocket Prism 2AC: Interface {#IFNAME} is down'
        priority: AVERAGE
        description: Opt-in interface alert. Set contextual {$UISP.IF.ALERT:"<interface>"}=1 for the intended physical uplink
          only.
        tags:
        - tag: scope
          value: availability
    - uuid: 1da83d76ea97438db367bae0b172b762
      name: airMAX wireless interface discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SSID},1.3.6.1.4.1.41112.1.4.5.1.2]
      key: uisp.airmax.wireless.discovery
      delay: 10m
      description: UBNT-AirMAX-MIB wireless status table. Ubiquiti documents ubntWlStatSignal as .1.3.6.1.4.1.41112.1.4.5.1.5.
      item_prototypes:
      - uuid: d18eb026e9b64aec8f03fc46daa6f17b
        name: 'airMAX {#SSID}: Signal'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.5.1.5.{#SNMPINDEX}]
        key: uisp.airmax.signal[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: dBm
      - uuid: 8620cf792fc8445cb8c4ec73e3d187cf
        name: 'airMAX {#SSID}: RSSI'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.5.1.6.{#SNMPINDEX}]
        key: uisp.airmax.rssi[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: dBm
      - uuid: c31e2694bdae47bab29dcdef9dd2922f
        name: 'airMAX {#SSID}: CCQ'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.5.1.7.{#SNMPINDEX}]
        key: uisp.airmax.ccq[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: '%'
      - uuid: 0cb62ad839444bcdb494fe4a1bceb5c2
        name: 'airMAX {#SSID}: Noise floor'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.5.1.8.{#SNMPINDEX}]
        key: uisp.airmax.noise[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: dBm
      - uuid: 2cdee0883a8749148ffcf9c4533f1a45
        name: 'airMAX {#SSID}: TX rate'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.5.1.9.{#SNMPINDEX}]
        key: uisp.airmax.txrate[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
      - uuid: 5b8f38a33e794e6bad5702da2fa2467a
        name: 'airMAX {#SSID}: RX rate'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.5.1.10.{#SNMPINDEX}]
        key: uisp.airmax.rxrate[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
      - uuid: 0a1e71537bc1469dacb44f4abed087e6
        name: 'airMAX {#SSID}: Station count'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.5.1.15.{#SNMPINDEX}]
        key: uisp.airmax.stations[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
      graph_prototypes:
      - uuid: eb89212257d343ef8555951fb78ba118
        name: 'airMAX {#SSID}: RF signal'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Rocket Prism 2AC by SNMP
            key: uisp.airmax.signal[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Rocket Prism 2AC by SNMP
            key: uisp.airmax.noise[{#SNMPINDEX}]
      - uuid: 2a477b0cfe714298817335f4c7ed4bd1
        name: 'airMAX {#SSID}: Link rates'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Rocket Prism 2AC by SNMP
            key: uisp.airmax.txrate[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Rocket Prism 2AC by SNMP
            key: uisp.airmax.rxrate[{#SNMPINDEX}]
    - uuid: 0d4fd22a1df24d258c8d4d88eb5da527
      name: airMAX quality discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#AMQ},1.3.6.1.4.1.41112.1.4.6.1.3]
      key: uisp.airmax.quality.discovery
      delay: 10m
      item_prototypes:
      - uuid: 63d5a3a7ee4e4c2ab61397aeda59c706
        name: airMAX quality
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.6.1.3.{#SNMPINDEX}]
        key: uisp.airmax.quality[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: '%'
      - uuid: 5f83559299d54a29a777fc823e9751b7
        name: airMAX capacity
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.6.1.4.{#SNMPINDEX}]
        key: uisp.airmax.capacity[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: '%'
      - uuid: 42f69b0530ac42f4a6a89972d722aa9d
        name: airMAX airtime
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.6.1.7.{#SNMPINDEX}]
        key: uisp.airmax.airtime[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: '%'
        preprocessing:
        - type: MULTIPLIER
          parameters:
          - '0.1'
      graph_prototypes:
      - uuid: d47201b181d24fa890478012c7f15c10
        name: airMAX quality / capacity
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Rocket Prism 2AC by SNMP
            key: uisp.airmax.quality[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Rocket Prism 2AC by SNMP
            key: uisp.airmax.capacity[{#SNMPINDEX}]
        - sortorder: '2'
          color: 1A7BC5
          item:
            host: Ubiquiti Rocket Prism 2AC by SNMP
            key: uisp.airmax.airtime[{#SNMPINDEX}]
    tags:
    - tag: vendor
      value: Ubiquiti
    - tag: family
      value: airMAX
    - tag: model
      value: R2AC-PRISM
    - tag: role
      value: PtP/PtMP base station
    macros:
    - macro: '{$ICMP.LOSS.WARN}'
      value: '20'
      description: Packet-loss percent threshold
    - macro: '{$ICMP.RTT.WARN}'
      value: '0.15'
      description: Round-trip time threshold (seconds)
    - macro: '{$UISP.IF.MATCHES}'
      value: .*
      description: Regex filter for interface descriptions
    - macro: '{$UISP.IF.ALERT}'
      value: '0'
      description: Global interface-down alert is disabled. Use contextual {$UISP.IF.ALERT:"<physical-interface>"}=1 to enable
        only for intended ports.
    - macro: '{$UISP.RF.ALERT}'
      value: '0'
      description: Enable RF-link-down trigger only after confirming the private MIB/profile works on this device/firmware.
    valuemaps:
    - uuid: a0cec57d83c642668d26eb9fc10c84b4
      name: IF-MIB ifOperStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
      - value: '4'
        newvalue: unknown
      - value: '5'
        newvalue: dormant
      - value: '6'
        newvalue: notPresent
      - value: '7'
        newvalue: lowerLayerDown
    - uuid: 8c6fda3c0b3942fda93fb55e8abe4826
      name: IF-MIB ifAdminStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
  graphs:
  - uuid: 150fd68d19fe42aabce7e4cfdb6c4972
    name: 'Rocket Prism 2AC: ICMP latency'
    graph_items:
    - color: 199C0D
      item:
        host: Ubiquiti Rocket Prism 2AC by SNMP
        key: icmppingsec
  - uuid: 7843136e4bc642da81c9cf95970783aa
    name: 'Rocket Prism 2AC: ICMP packet loss'
    graph_items:
    - color: 199C0D
      item:
        host: Ubiquiti Rocket Prism 2AC by SNMP
        key: icmppingloss
  - uuid: 07b29a5f37f94601a1aa25f3fc7ca0fb
    name: 'Rocket Prism 2AC: SNMP agent uptime'
    graph_items:
    - color: 199C0D
      item:
        host: Ubiquiti Rocket Prism 2AC by SNMP
        key: uisp.system.uptime
