zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: 0db0642974ad4aae9f49e40674c1432d
    template: Ubiquiti airFiber 5XHD by SNMP
    name: Ubiquiti airFiber 5XHD by SNMP
    description: 'Zabbix 7.0.30 template for Ubiquiti airFiber 5XHD (AF-5XHD). Role: PtP. SNMP assessment: Yes. airFiber software/user
      documentation includes an SNMP agent; AF-5XHD uses the distinct UBNT-AFLTU-MIB; other listed radios use legacy UBNT-AirFIBER-MIB
      conditionally. Private MIB objects vary by airFiber platform/firmware; template keeps standard MIB interface monitoring
      plus legacy airFiber status LLD. SNMP credentials/interface are configured at the Zabbix host, not in this template.'
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 4cb0c570972047c399953ae7180ba023
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      delay: 1m
      history: 7d
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 3496d2d70819403a934ea32025d95c30
        expression: max(/Ubiquiti airFiber 5XHD by SNMP/icmpping,#3)=0
        name: 'airFiber 5XHD: Unavailable by ICMP ping'
        priority: HIGH
        description: Three consecutive ICMP checks failed.
        tags:
        - tag: scope
          value: availability
    - uuid: b905f2c08d494e35806719d20fc12600
      name: ICMP packet loss
      type: SIMPLE
      key: icmppingloss
      delay: 1m
      value_type: FLOAT
      units: '%'
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 55727a26c49e45bbbe8d3678da7e732f
        expression: min(/Ubiquiti airFiber 5XHD by SNMP/icmppingloss,5m)>{$ICMP.LOSS.WARN} and min(/Ubiquiti airFiber 5XHD
          by SNMP/icmppingloss,5m)<100
        name: 'airFiber 5XHD: High ICMP packet loss'
        priority: WARNING
        description: Packet loss exceeded the warning threshold for 5 minutes.
        tags:
        - tag: scope
          value: performance
    - uuid: 8b36ac9125f44a70966af58ac6fc4dc6
      name: ICMP response time
      type: SIMPLE
      key: icmppingsec
      delay: 1m
      value_type: FLOAT
      units: s
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 5f23561354ee48848ac57fa472e5a7f7
        expression: avg(/Ubiquiti airFiber 5XHD by SNMP/icmppingsec,5m)>{$ICMP.RTT.WARN}
        name: 'airFiber 5XHD: High ICMP response time'
        priority: WARNING
        description: Average round-trip time exceeded threshold for 5 minutes.
        tags:
        - tag: scope
          value: performance
    - uuid: 81fcb0df09214609943001e677ee957c
      name: SNMP network uptime
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.3.0]
      key: uisp.system.uptime
      delay: 1m
      units: uptime
      description: sysUpTime (TimeTicks / 100); measures SNMP agent uptime, not guaranteed hardware uptime.
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 8f21a151786942aab13ccb66ccd22dc8
        expression: nodata(/Ubiquiti airFiber 5XHD by SNMP/uisp.system.uptime,15m)=1 and last(/Ubiquiti airFiber 5XHD by SNMP/icmpping)=1
        name: 'airFiber 5XHD: SNMP stops responding while ping succeeds'
        priority: AVERAGE
        description: Device replies to ping but sysUpTime polling has had no data for 15 minutes; check SNMP credentials/firewall.
        tags:
        - tag: scope
          value: availability
    - uuid: 560de34b84da4268b50bdf79e8839ad0
      name: SNMP system description
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.1.0]
      key: uisp.system.description
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 109629e5b20548389f59683fb6b11e9a
      name: SNMP system object ID
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.2.0]
      key: uisp.system.objectid
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 902ff5b822dc4af4b3eb36255ea25cbb
      name: SNMP system name
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.5.0]
      key: uisp.system.name
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: ccc53ec28eac4cf1b5bb273fef4306c8
      name: SNMP system location
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.6.0]
      key: uisp.system.location
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: f51bc9fddb6c46f1852f54343cecb296
      name: SNMP system contact
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.4.0]
      key: uisp.system.contact
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: c994a16b487b4b0a953f8e58e46efcff
      name: LTU device model
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.41112.1.10.1.3.2.0]
      key: uisp.ltu.model
      delay: 10m
      value_type: CHAR
      tags:
      - tag: component
        value: wireless
    - uuid: 740098facde04d739e6c6e2d9e0ee957
      name: LTU firmware version
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.41112.1.10.1.3.4.0]
      key: uisp.ltu.firmware
      delay: 10m
      value_type: CHAR
      tags:
      - tag: component
        value: wireless
    - uuid: 926b4844e68c45b389fba1217b96099f
      name: LTU memory usage
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.41112.1.10.1.3.5.0]
      key: uisp.ltu.memory
      delay: 2m
      units: '%'
      tags:
      - tag: component
        value: wireless
    - uuid: 30c5da272f694a1d8eb010af52dcafaa
      name: LTU CPU usage
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.41112.1.10.1.3.6.0]
      key: uisp.ltu.cpu
      delay: 2m
      units: '%'
      tags:
      - tag: component
        value: wireless
    - uuid: 472ef22ad8544b888ed2decc1e34642d
      name: LTU uptime
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.41112.1.10.1.3.7.0]
      key: uisp.ltu.uptime
      delay: 2m
      units: s
      tags:
      - tag: component
        value: wireless
    - uuid: 0c6ed227bf334085a94fd86b33d1ab16
      name: LTU configured frequency
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.41112.1.10.1.2.2.0]
      key: uisp.ltu.frequency
      delay: 2m
      units: MHz
      tags:
      - tag: component
        value: wireless
    - uuid: 7ded025b268b47d995f4353152ec846e
      name: LTU configured bandwidth
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.41112.1.10.1.2.4.0]
      key: uisp.ltu.bandwidth
      delay: 2m
      units: MHz
      tags:
      - tag: component
        value: wireless
    discovery_rules:
    - uuid: cea614cf903e47f39095e6b9fffab468
      name: Network interface discovery (IF-MIB)
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFNAME},1.3.6.1.2.1.2.2.1.2,{#IFADMIN},1.3.6.1.2.1.2.2.1.7]
      key: uisp.if.discovery
      delay: 1h
      description: Standard IF-MIB/IF-X-MIB discovery. High-capacity 64-bit counters may be unsupported on older devices;
        classic 32-bit counters are included as fallback.
      filter:
        conditions:
        - macro: '{#IFNAME}'
          value: '{$UISP.IF.MATCHES}'
      item_prototypes:
      - uuid: 8d9d422b79164e6b88f24cf3fa8d41dd
        name: 'Interface {#IFNAME}: Operational status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]
        key: uisp.if.status[{#SNMPINDEX}]
        delay: 2m
        valuemap:
          name: IF-MIB ifOperStatus
        tags:
        - tag: component
          value: network
      - uuid: 7c5b499bf6004263ab8905f063b2e1b1
        name: 'Interface {#IFNAME}: Admin status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}]
        key: uisp.if.admin[{#SNMPINDEX}]
        delay: 5m
        valuemap:
          name: IF-MIB ifAdminStatus
        tags:
        - tag: component
          value: network
      - uuid: d61bb4cb391644f58889a911129ef93e
        name: 'Interface {#IFNAME}: Incoming traffic (64-bit)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}]
        key: uisp.if.hc.in[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: 64-bit IF-MIB high-capacity octet counter, suitable for multi-gigabit uplinks.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 14b52eaf241e4a0c8413f1bcea10a574
        name: 'Interface {#IFNAME}: Outgoing traffic (64-bit)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}]
        key: uisp.if.hc.out[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: 64-bit IF-MIB high-capacity octet counter, suitable for multi-gigabit uplinks.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: a816959506e84ee4aacca6340fcc9cbe
        name: 'Interface {#IFNAME}: Incoming traffic (32-bit fallback)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.10.{#SNMPINDEX}]
        key: uisp.if.legacy.in[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: Counter converted from bytes/s to bits/s. 32-bit counters may wrap at high throughput.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: a9ea8a0471e14668afc64231ea5323f0
        name: 'Interface {#IFNAME}: Outgoing traffic (32-bit fallback)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.16.{#SNMPINDEX}]
        key: uisp.if.legacy.out[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: Counter converted from bytes/s to bits/s. 32-bit counters may wrap at high throughput.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 4408d61b914443538928e3787034f628
        name: 'Interface {#IFNAME}: Input errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}]
        key: uisp.if.in.errors[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: errors
      - uuid: 2c5ed015171d45e4baf3b4cc13d9fc45
        name: 'Interface {#IFNAME}: Output errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}]
        key: uisp.if.out.errors[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: errors
      - uuid: 15563c861c2040bd8d0c39126518f4be
        name: 'Interface {#IFNAME}: Input discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}]
        key: uisp.if.in.discards[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: errors
      - uuid: 22b7985b27774c3b8fc3ad82fb28feb2
        name: 'Interface {#IFNAME}: Output discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}]
        key: uisp.if.out.discards[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: errors
      graph_prototypes:
      - uuid: 4016c342cd614c728e4fb8c42fd3cf53
        name: 'Interface {#IFNAME}: Traffic (64-bit)'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti airFiber 5XHD by SNMP
            key: uisp.if.hc.in[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti airFiber 5XHD by SNMP
            key: uisp.if.hc.out[{#SNMPINDEX}]
      - uuid: 0a1ab37f7d4d472288c30d6a76bd3369
        name: 'Interface {#IFNAME}: Traffic (32-bit fallback)'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti airFiber 5XHD by SNMP
            key: uisp.if.legacy.in[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti airFiber 5XHD by SNMP
            key: uisp.if.legacy.out[{#SNMPINDEX}]
      - uuid: d4186d05c681474d8539692607953fce
        name: 'Interface {#IFNAME}: Errors and discards'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti airFiber 5XHD by SNMP
            key: uisp.if.in.errors[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti airFiber 5XHD by SNMP
            key: uisp.if.out.errors[{#SNMPINDEX}]
        - sortorder: '2'
          color: 1A7BC5
          item:
            host: Ubiquiti airFiber 5XHD by SNMP
            key: uisp.if.in.discards[{#SNMPINDEX}]
        - sortorder: '3'
          color: 6C59DC
          item:
            host: Ubiquiti airFiber 5XHD by SNMP
            key: uisp.if.out.discards[{#SNMPINDEX}]
      trigger_prototypes:
      - uuid: b0a7642495ad45429c14d1d767cad92c
        expression: '{$UISP.IF.ALERT:"{#IFNAME}"}=1 and last(/Ubiquiti airFiber 5XHD by SNMP/uisp.if.status[{#SNMPINDEX}])=2'
        name: 'airFiber 5XHD: Interface {#IFNAME} is down'
        priority: AVERAGE
        description: Opt-in interface alert. Set contextual {$UISP.IF.ALERT:"<interface>"}=1 for the intended physical uplink
          only.
        tags:
        - tag: scope
          value: availability
    - uuid: c796f42e43be42bcb42a97c10623a844
      name: LTU remote station discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#REMOTENAME},1.3.6.1.4.1.41112.1.10.1.4.1.13]
      key: uisp.ltu.station.discovery
      delay: 10m
      description: UBNT-AFLTU-MIB remote station table. Table instances are based on station MAC address.
      item_prototypes:
      - uuid: 8ea82661ea58428b8bb708a452e0eb44
        name: 'LTU station {#REMOTENAME}: TX capacity'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.10.1.4.1.3.{#SNMPINDEX}]
        key: uisp.ltu.sta.txcap[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: Kbps
      - uuid: 1bfc3f668b1b4799b56f00ccbfdf3367
        name: 'LTU station {#REMOTENAME}: RX capacity'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.10.1.4.1.4.{#SNMPINDEX}]
        key: uisp.ltu.sta.rxcap[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: Kbps
      - uuid: 424e7e3f445b41958f1b9401ffe031f3
        name: 'LTU station {#REMOTENAME}: RX power chain 0'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.10.1.4.1.5.{#SNMPINDEX}]
        key: uisp.ltu.sta.rx0[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: dBm
      - uuid: 4350ad3a3c0c4551b079141b6127def0
        name: 'LTU station {#REMOTENAME}: RX power chain 1'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.10.1.4.1.6.{#SNMPINDEX}]
        key: uisp.ltu.sta.rx1[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: dBm
      - uuid: 4da095bc085f4c24acdd47130b9ea82e
        name: 'LTU station {#REMOTENAME}: Remote latency'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.10.1.4.1.22.{#SNMPINDEX}]
        key: uisp.ltu.sta.latency[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: ms
      - uuid: 08d89a627e2e4881a411a8b1a4ed4f2f
        name: 'LTU station {#REMOTENAME}: Remote distance'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.10.1.4.1.23.{#SNMPINDEX}]
        key: uisp.ltu.sta.distance[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: m
      graph_prototypes:
      - uuid: ac7fcaa0c50f42a0a7480436e67ba55f
        name: 'LTU station {#REMOTENAME}: Capacity'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti airFiber 5XHD by SNMP
            key: uisp.ltu.sta.txcap[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti airFiber 5XHD by SNMP
            key: uisp.ltu.sta.rxcap[{#SNMPINDEX}]
      - uuid: 16a9b07b838246bfa785d11424d974dc
        name: 'LTU station {#REMOTENAME}: RX power'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti airFiber 5XHD by SNMP
            key: uisp.ltu.sta.rx0[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti airFiber 5XHD by SNMP
            key: uisp.ltu.sta.rx1[{#SNMPINDEX}]
    tags:
    - tag: vendor
      value: Ubiquiti
    - tag: family
      value: airFiber
    - tag: model
      value: AF-5XHD
    - tag: role
      value: PtP
    macros:
    - macro: '{$ICMP.LOSS.WARN}'
      value: '20'
      description: Packet-loss percent threshold
    - macro: '{$ICMP.RTT.WARN}'
      value: '0.15'
      description: Round-trip time threshold (seconds)
    - macro: '{$UISP.IF.MATCHES}'
      value: .*
      description: Regex filter for interface descriptions
    - macro: '{$UISP.IF.ALERT}'
      value: '0'
      description: Global interface-down alert is disabled. Use contextual {$UISP.IF.ALERT:"<physical-interface>"}=1 to enable
        only for intended ports.
    - macro: '{$UISP.RF.ALERT}'
      value: '0'
      description: Enable RF-link-down trigger only after confirming the private MIB/profile works on this device/firmware.
    valuemaps:
    - uuid: 566746c3905b42359ca9c3a5c552ac96
      name: IF-MIB ifOperStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
      - value: '4'
        newvalue: unknown
      - value: '5'
        newvalue: dormant
      - value: '6'
        newvalue: notPresent
      - value: '7'
        newvalue: lowerLayerDown
    - uuid: a4178db4824741c391f808b232fe293d
      name: IF-MIB ifAdminStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
  graphs:
  - uuid: 9747d329deae4617acb05a397339c6e6
    name: 'airFiber 5XHD: ICMP latency'
    graph_items:
    - color: 199C0D
      item:
        host: Ubiquiti airFiber 5XHD by SNMP
        key: icmppingsec
  - uuid: c8930726305f4bccbf9fc73c62024d2a
    name: 'airFiber 5XHD: ICMP packet loss'
    graph_items:
    - color: 199C0D
      item:
        host: Ubiquiti airFiber 5XHD by SNMP
        key: icmppingloss
  - uuid: 5fac0c1b1193427c8100023780f24c1b
    name: 'airFiber 5XHD: SNMP agent uptime'
    graph_items:
    - color: 199C0D
      item:
        host: Ubiquiti airFiber 5XHD by SNMP
        key: uisp.system.uptime
