    macros:
    - macro: '{$ICMP.LOSS.WARN}'
      value: '20'
      description: Packet-loss percent threshold
    - macro: '{$ICMP.RTT.WARN}'
      value: '0.15'
      description: Round-trip time threshold (seconds)
    - macro: '{$ACPRO.IF.MATCHES}'
      value: .*
      description: Regex filter for interface descriptions
    - macro: '{$ACPRO.IF.ALERT}'
      value: '0'
      description: Default 0 disables down alerts for other ports; create contextual overrides for any additional
        live Ethernet interfaces.
    - macro: '{$ACPRO.IF.ALERT:"eth0"}'
      value: '1'
      description: Enable link-down warning for common main Ethernet interface name eth0; confirm your AP ifDescr
        first.
    - macro: '{$ACPRO.RADIO.UTIL.WARN}'
      value: '85'
      description: 10-minute average radio utilization threshold (%)
    valuemaps:
    - uuid: 39182b2940c64ddaa06c4f978c998137
      name: TruthValue (1=true, 2=false)
      mappings:
      - value: '1'
        newvalue: 'True'
      - value: '2'
        newvalue: 'False'
    - uuid: 5835f514fd1f4281bd3cf4e7bced1a5f
      name: IF-MIB ifOperStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
      - value: '4'
        newvalue: unknown
      - value: '5'
        newvalue: dormant
      - value: '6'
        newvalue: notPresent
      - value: '7'
        newvalue: lowerLayerDown
    - uuid: ef936e46c1c04aa6896196657d1ea8cd
      name: IF-MIB ifAdminStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
