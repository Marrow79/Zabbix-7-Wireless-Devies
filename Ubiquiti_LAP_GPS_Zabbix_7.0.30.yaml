zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: 1389e10e13a4486da548db7f616e19ab
    template: Ubiquiti Lite AP GPS by SNMP
    name: Ubiquiti Lite AP GPS by SNMP
    description: 'Zabbix 7.0.30 template for Ubiquiti Lite AP GPS (LAP-GPS). Role: PtMP AP. SNMP assessment: Yes. Ubiquiti
      states all airMAX devices support SNMPv1 read access; UBNT-AirMAX-MIB used for wireless metrics. Private airMAX MIB
      support can differ by airOS generation; unsupported individual OIDs will become unsupported items, not block import.
      SNMP credentials/interface are configured at the Zabbix host, not in this template.'
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 9622f73753304faf9fe1b3aab6aa29cb
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      delay: 1m
      history: 7d
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: cd6a443376da4e9892995adfffbacdd5
        expression: max(/Ubiquiti Lite AP GPS by SNMP/icmpping,#3)=0
        name: 'Lite AP GPS: Unavailable by ICMP ping'
        priority: HIGH
        description: Three consecutive ICMP checks failed.
        tags:
        - tag: scope
          value: availability
    - uuid: 2b85170d766f43cab5913a6129067d5b
      name: ICMP packet loss
      type: SIMPLE
      key: icmppingloss
      delay: 1m
      value_type: FLOAT
      units: '%'
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 561068a4e0614bf29ade40e872c0ce89
        expression: min(/Ubiquiti Lite AP GPS by SNMP/icmppingloss,5m)>{$ICMP.LOSS.WARN} and min(/Ubiquiti Lite AP GPS by
          SNMP/icmppingloss,5m)<100
        name: 'Lite AP GPS: High ICMP packet loss'
        priority: WARNING
        description: Packet loss exceeded the warning threshold for 5 minutes.
        tags:
        - tag: scope
          value: performance
    - uuid: c6b21931eb2945e180d6e120b2a3fc08
      name: ICMP response time
      type: SIMPLE
      key: icmppingsec
      delay: 1m
      value_type: FLOAT
      units: s
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 269289ac26344ea581c844dd4e8d4c2f
        expression: avg(/Ubiquiti Lite AP GPS by SNMP/icmppingsec,5m)>{$ICMP.RTT.WARN}
        name: 'Lite AP GPS: High ICMP response time'
        priority: WARNING
        description: Average round-trip time exceeded threshold for 5 minutes.
        tags:
        - tag: scope
          value: performance
    - uuid: 649eda0bea8b41b4a0e4635c5d45b92f
      name: SNMP network uptime
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.3.0]
      key: uisp.system.uptime
      delay: 1m
      units: uptime
      description: sysUpTime (TimeTicks / 100); measures SNMP agent uptime, not guaranteed hardware uptime.
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 11524db048ef47e891fe8bf698180241
        expression: nodata(/Ubiquiti Lite AP GPS by SNMP/uisp.system.uptime,15m)=1 and last(/Ubiquiti Lite AP GPS by SNMP/icmpping)=1
        name: 'Lite AP GPS: SNMP stops responding while ping succeeds'
        priority: AVERAGE
        description: Device replies to ping but sysUpTime polling has had no data for 15 minutes; check SNMP credentials/firewall.
        tags:
        - tag: scope
          value: availability
    - uuid: 4b24bf2bef85413d9bcc53025120b8a1
      name: SNMP system description
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.1.0]
      key: uisp.system.description
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: b6ad140f41e04d72ace9b99aef304e9c
      name: SNMP system object ID
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.2.0]
      key: uisp.system.objectid
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: fd1b24eeca6d4d90b0eb6b3625c682ac
      name: SNMP system name
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.5.0]
      key: uisp.system.name
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: ff310f1003aa476da5cc29519220c744
      name: SNMP system location
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.6.0]
      key: uisp.system.location
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: ebd2103e11504265973fd51d13d7ed2b
      name: SNMP system contact
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.4.0]
      key: uisp.system.contact
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    discovery_rules:
    - uuid: 0c0e2077af6b407082459578eb76f020
      name: Network interface discovery (IF-MIB)
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFNAME},1.3.6.1.2.1.2.2.1.2,{#IFADMIN},1.3.6.1.2.1.2.2.1.7]
      key: uisp.if.discovery
      delay: 1h
      description: Standard IF-MIB/IF-X-MIB discovery. High-capacity 64-bit counters may be unsupported on older devices;
        classic 32-bit counters are included as fallback.
      filter:
        conditions:
        - macro: '{#IFNAME}'
          value: '{$UISP.IF.MATCHES}'
      item_prototypes:
      - uuid: b82bd36f08ac4ddc874fc6e36cd6c269
        name: 'Interface {#IFNAME}: Operational status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]
        key: uisp.if.status[{#SNMPINDEX}]
        delay: 2m
        valuemap:
          name: IF-MIB ifOperStatus
        tags:
        - tag: component
          value: network
      - uuid: 199780081f184fae9fb533169f96786b
        name: 'Interface {#IFNAME}: Admin status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}]
        key: uisp.if.admin[{#SNMPINDEX}]
        delay: 5m
        valuemap:
          name: IF-MIB ifAdminStatus
        tags:
        - tag: component
          value: network
      - uuid: b025b36abc744a5fa101e11d77da693b
        name: 'Interface {#IFNAME}: Incoming traffic (64-bit)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}]
        key: uisp.if.hc.in[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: 64-bit IF-MIB high-capacity octet counter, suitable for multi-gigabit uplinks.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 67c5c80b89124fc88da157d2489d98b1
        name: 'Interface {#IFNAME}: Outgoing traffic (64-bit)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}]
        key: uisp.if.hc.out[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: 64-bit IF-MIB high-capacity octet counter, suitable for multi-gigabit uplinks.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 08ae8517eca54d3f92db11d6a99bfaa5
        name: 'Interface {#IFNAME}: Incoming traffic (32-bit fallback)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.10.{#SNMPINDEX}]
        key: uisp.if.legacy.in[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: Counter converted from bytes/s to bits/s. 32-bit counters may wrap at high throughput.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: f8a19cb13f764a138bf888a6da296757
        name: 'Interface {#IFNAME}: Outgoing traffic (32-bit fallback)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.16.{#SNMPINDEX}]
        key: uisp.if.legacy.out[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: Counter converted from bytes/s to bits/s. 32-bit counters may wrap at high throughput.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: f1baebfe442043deb62152c90c706880
        name: 'Interface {#IFNAME}: Input errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}]
        key: uisp.if.in.errors[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: errors
      - uuid: d2f0dd569725480c823251d0cc1ba4bf
        name: 'Interface {#IFNAME}: Output errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}]
        key: uisp.if.out.errors[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: errors
      - uuid: 45e06d88dab24beea5eee7425192715a
        name: 'Interface {#IFNAME}: Input discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}]
        key: uisp.if.in.discards[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: errors
      - uuid: 53f3381df0274cda864a85986d9d637f
        name: 'Interface {#IFNAME}: Output discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}]
        key: uisp.if.out.discards[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: errors
      graph_prototypes:
      - uuid: f27457591bf3408090d139d39c769e5f
        name: 'Interface {#IFNAME}: Traffic (64-bit)'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Lite AP GPS by SNMP
            key: uisp.if.hc.in[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Lite AP GPS by SNMP
            key: uisp.if.hc.out[{#SNMPINDEX}]
      - uuid: 838a0ec291aa4b579eaba5330057670d
        name: 'Interface {#IFNAME}: Traffic (32-bit fallback)'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Lite AP GPS by SNMP
            key: uisp.if.legacy.in[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Lite AP GPS by SNMP
            key: uisp.if.legacy.out[{#SNMPINDEX}]
      - uuid: c0d1cecf904844f981a05494921f9e5e
        name: 'Interface {#IFNAME}: Errors and discards'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Lite AP GPS by SNMP
            key: uisp.if.in.errors[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Lite AP GPS by SNMP
            key: uisp.if.out.errors[{#SNMPINDEX}]
        - sortorder: '2'
          color: 1A7BC5
          item:
            host: Ubiquiti Lite AP GPS by SNMP
            key: uisp.if.in.discards[{#SNMPINDEX}]
        - sortorder: '3'
          color: 6C59DC
          item:
            host: Ubiquiti Lite AP GPS by SNMP
            key: uisp.if.out.discards[{#SNMPINDEX}]
      trigger_prototypes:
      - uuid: 40a6b974851840b6a673fc62aa993d6b
        expression: '{$UISP.IF.ALERT:"{#IFNAME}"}=1 and last(/Ubiquiti Lite AP GPS by SNMP/uisp.if.status[{#SNMPINDEX}])=2'
        name: 'Lite AP GPS: Interface {#IFNAME} is down'
        priority: AVERAGE
        description: Opt-in interface alert. Set contextual {$UISP.IF.ALERT:"<interface>"}=1 for the intended physical uplink
          only.
        tags:
        - tag: scope
          value: availability
    - uuid: 6fcba574656349378c8b6eff21621db6
      name: airMAX wireless interface discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SSID},1.3.6.1.4.1.41112.1.4.5.1.2]
      key: uisp.airmax.wireless.discovery
      delay: 10m
      description: UBNT-AirMAX-MIB wireless status table. Ubiquiti documents ubntWlStatSignal as .1.3.6.1.4.1.41112.1.4.5.1.5.
      item_prototypes:
      - uuid: 415f6f62dd614afcbc40a162003c252d
        name: 'airMAX {#SSID}: Signal'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.5.1.5.{#SNMPINDEX}]
        key: uisp.airmax.signal[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: dBm
      - uuid: c3919c8bbc54490f8256cf057d645c62
        name: 'airMAX {#SSID}: RSSI'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.5.1.6.{#SNMPINDEX}]
        key: uisp.airmax.rssi[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: dBm
      - uuid: 6e16a068a434413fa96ef7bbdcf86aa3
        name: 'airMAX {#SSID}: CCQ'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.5.1.7.{#SNMPINDEX}]
        key: uisp.airmax.ccq[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: '%'
      - uuid: aed97965c90d42cd9512bd249514563a
        name: 'airMAX {#SSID}: Noise floor'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.5.1.8.{#SNMPINDEX}]
        key: uisp.airmax.noise[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: dBm
      - uuid: 43a1a29d4917466d93dacc7a8608513d
        name: 'airMAX {#SSID}: TX rate'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.5.1.9.{#SNMPINDEX}]
        key: uisp.airmax.txrate[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
      - uuid: 532474a9113b4347912d77e7d9ef3d7e
        name: 'airMAX {#SSID}: RX rate'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.5.1.10.{#SNMPINDEX}]
        key: uisp.airmax.rxrate[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
      - uuid: f8b713c09af541eab041274ca68d71f3
        name: 'airMAX {#SSID}: Station count'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.5.1.15.{#SNMPINDEX}]
        key: uisp.airmax.stations[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
      graph_prototypes:
      - uuid: 6985208ba4994227a8a5a5b5c27819cd
        name: 'airMAX {#SSID}: RF signal'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Lite AP GPS by SNMP
            key: uisp.airmax.signal[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Lite AP GPS by SNMP
            key: uisp.airmax.noise[{#SNMPINDEX}]
      - uuid: 169d02c2f3ac487f9550241b97ab9d89
        name: 'airMAX {#SSID}: Link rates'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Lite AP GPS by SNMP
            key: uisp.airmax.txrate[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Lite AP GPS by SNMP
            key: uisp.airmax.rxrate[{#SNMPINDEX}]
    - uuid: 79d6fb22ddf541238c9da55b2a6c78cd
      name: airMAX quality discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#AMQ},1.3.6.1.4.1.41112.1.4.6.1.3]
      key: uisp.airmax.quality.discovery
      delay: 10m
      item_prototypes:
      - uuid: d0abc32457094854bb96110784b38e75
        name: airMAX quality
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.6.1.3.{#SNMPINDEX}]
        key: uisp.airmax.quality[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: '%'
      - uuid: 4a6471b02c7348cca6c82263ccf4e5e8
        name: airMAX capacity
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.6.1.4.{#SNMPINDEX}]
        key: uisp.airmax.capacity[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: '%'
      - uuid: 92e6603afc9a43ea9c2a47667a4adec0
        name: airMAX airtime
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.6.1.7.{#SNMPINDEX}]
        key: uisp.airmax.airtime[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: '%'
        preprocessing:
        - type: MULTIPLIER
          parameters:
          - '0.1'
      graph_prototypes:
      - uuid: fe2ba1f40a6a4ac8a0c283fdf010c333
        name: airMAX quality / capacity
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Lite AP GPS by SNMP
            key: uisp.airmax.quality[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Lite AP GPS by SNMP
            key: uisp.airmax.capacity[{#SNMPINDEX}]
        - sortorder: '2'
          color: 1A7BC5
          item:
            host: Ubiquiti Lite AP GPS by SNMP
            key: uisp.airmax.airtime[{#SNMPINDEX}]
    tags:
    - tag: vendor
      value: Ubiquiti
    - tag: family
      value: airMAX
    - tag: model
      value: LAP-GPS
    - tag: role
      value: PtMP AP
    macros:
    - macro: '{$ICMP.LOSS.WARN}'
      value: '20'
      description: Packet-loss percent threshold
    - macro: '{$ICMP.RTT.WARN}'
      value: '0.15'
      description: Round-trip time threshold (seconds)
    - macro: '{$UISP.IF.MATCHES}'
      value: .*
      description: Regex filter for interface descriptions
    - macro: '{$UISP.IF.ALERT}'
      value: '0'
      description: Global interface-down alert is disabled. Use contextual {$UISP.IF.ALERT:"<physical-interface>"}=1 to enable
        only for intended ports.
    - macro: '{$UISP.RF.ALERT}'
      value: '0'
      description: Enable RF-link-down trigger only after confirming the private MIB/profile works on this device/firmware.
    valuemaps:
    - uuid: 975bf3f0f6ac4cbb95d5cd4de95d5e19
      name: IF-MIB ifOperStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
      - value: '4'
        newvalue: unknown
      - value: '5'
        newvalue: dormant
      - value: '6'
        newvalue: notPresent
      - value: '7'
        newvalue: lowerLayerDown
    - uuid: 450cad6234d648cd94b97982177be048
      name: IF-MIB ifAdminStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
  graphs:
  - uuid: 2a53f2012b84496193730cb7bffb798c
    name: 'Lite AP GPS: ICMP latency'
    graph_items:
    - color: 199C0D
      item:
        host: Ubiquiti Lite AP GPS by SNMP
        key: icmppingsec
  - uuid: 67b3880e509746df877035e98518a895
    name: 'Lite AP GPS: ICMP packet loss'
    graph_items:
    - color: 199C0D
      item:
        host: Ubiquiti Lite AP GPS by SNMP
        key: icmppingloss
  - uuid: 02ae4f26b0364ad99dbf6977812e4b11
    name: 'Lite AP GPS: SNMP agent uptime'
    graph_items:
    - color: 199C0D
      item:
        host: Ubiquiti Lite AP GPS by SNMP
        key: uisp.system.uptime
