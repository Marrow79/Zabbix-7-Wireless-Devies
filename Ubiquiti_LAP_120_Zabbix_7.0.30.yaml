zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: fb67648cae3644c1a28ae04e0e966280
    template: Ubiquiti Lite AP by SNMP
    name: Ubiquiti Lite AP by SNMP
    description: 'Zabbix 7.0.30 template for Ubiquiti Lite AP (LAP-120). Role: PtMP AP. SNMP assessment: Yes. Ubiquiti states
      all airMAX devices support SNMPv1 read access; UBNT-AirMAX-MIB used for wireless metrics. Private airMAX MIB support
      can differ by airOS generation; unsupported individual OIDs will become unsupported items, not block import. SNMP credentials/interface
      are configured at the Zabbix host, not in this template.'
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 55795480ba0b450a99f2138df26c7d8a
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      delay: 1m
      history: 7d
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 73131c2d99aa4293a4c4eefc9763e84b
        expression: max(/Ubiquiti Lite AP by SNMP/icmpping,#3)=0
        name: 'Lite AP: Unavailable by ICMP ping'
        priority: HIGH
        description: Three consecutive ICMP checks failed.
        tags:
        - tag: scope
          value: availability
    - uuid: f4b074a832f34bb08da3d9d4be73c179
      name: ICMP packet loss
      type: SIMPLE
      key: icmppingloss
      delay: 1m
      value_type: FLOAT
      units: '%'
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 16d6b0e595e54310946d8905acf96c55
        expression: min(/Ubiquiti Lite AP by SNMP/icmppingloss,5m)>{$ICMP.LOSS.WARN} and min(/Ubiquiti Lite AP by SNMP/icmppingloss,5m)<100
        name: 'Lite AP: High ICMP packet loss'
        priority: WARNING
        description: Packet loss exceeded the warning threshold for 5 minutes.
        tags:
        - tag: scope
          value: performance
    - uuid: 39dd8bde44f24f70b27f95ada9efb82b
      name: ICMP response time
      type: SIMPLE
      key: icmppingsec
      delay: 1m
      value_type: FLOAT
      units: s
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 98483061b3b640e8a18a75572f2742b9
        expression: avg(/Ubiquiti Lite AP by SNMP/icmppingsec,5m)>{$ICMP.RTT.WARN}
        name: 'Lite AP: High ICMP response time'
        priority: WARNING
        description: Average round-trip time exceeded threshold for 5 minutes.
        tags:
        - tag: scope
          value: performance
    - uuid: e1d7f62e0fa2432da04ff0621071384f
      name: SNMP network uptime
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.3.0]
      key: uisp.system.uptime
      delay: 1m
      units: uptime
      description: sysUpTime (TimeTicks / 100); measures SNMP agent uptime, not guaranteed hardware uptime.
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: bfa60867a1b345d8978f109b4f05ac48
        expression: nodata(/Ubiquiti Lite AP by SNMP/uisp.system.uptime,15m)=1 and last(/Ubiquiti Lite AP by SNMP/icmpping)=1
        name: 'Lite AP: SNMP stops responding while ping succeeds'
        priority: AVERAGE
        description: Device replies to ping but sysUpTime polling has had no data for 15 minutes; check SNMP credentials/firewall.
        tags:
        - tag: scope
          value: availability
    - uuid: d752216ec7bf4a5ebc7d9e7d7570cda3
      name: SNMP system description
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.1.0]
      key: uisp.system.description
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: a51962a082eb4468bf6a945d5d3d3637
      name: SNMP system object ID
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.2.0]
      key: uisp.system.objectid
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 8e5740f78b78473abedd1f219811fd4e
      name: SNMP system name
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.5.0]
      key: uisp.system.name
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 8e991b8f9ce0472f8c85f000c7759e5e
      name: SNMP system location
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.6.0]
      key: uisp.system.location
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 3a1493e528a04a9aac441a830e371db1
      name: SNMP system contact
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.4.0]
      key: uisp.system.contact
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    discovery_rules:
    - uuid: 9ad002e073e44f6c97a802dbbb80e64a
      name: Network interface discovery (IF-MIB)
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFNAME},1.3.6.1.2.1.2.2.1.2,{#IFADMIN},1.3.6.1.2.1.2.2.1.7]
      key: uisp.if.discovery
      delay: 1h
      description: Standard IF-MIB/IF-X-MIB discovery. High-capacity 64-bit counters may be unsupported on older devices;
        classic 32-bit counters are included as fallback.
      filter:
        conditions:
        - macro: '{#IFNAME}'
          value: '{$UISP.IF.MATCHES}'
      item_prototypes:
      - uuid: d7ca9083e8214fba9cea2f7be3ada63c
        name: 'Interface {#IFNAME}: Operational status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]
        key: uisp.if.status[{#SNMPINDEX}]
        delay: 2m
        valuemap:
          name: IF-MIB ifOperStatus
        tags:
        - tag: component
          value: network
      - uuid: 7f410a4eb03c4420b00119bab45a515a
        name: 'Interface {#IFNAME}: Admin status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}]
        key: uisp.if.admin[{#SNMPINDEX}]
        delay: 5m
        valuemap:
          name: IF-MIB ifAdminStatus
        tags:
        - tag: component
          value: network
      - uuid: 71a199364fc848698b35ffc3348dbe3d
        name: 'Interface {#IFNAME}: Incoming traffic (64-bit)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}]
        key: uisp.if.hc.in[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: 64-bit IF-MIB high-capacity octet counter, suitable for multi-gigabit uplinks.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 6183687aa7854795badfb042c183dee6
        name: 'Interface {#IFNAME}: Outgoing traffic (64-bit)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}]
        key: uisp.if.hc.out[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: 64-bit IF-MIB high-capacity octet counter, suitable for multi-gigabit uplinks.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 8479c0bdc8f741f6abe187ae140a44ec
        name: 'Interface {#IFNAME}: Incoming traffic (32-bit fallback)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.10.{#SNMPINDEX}]
        key: uisp.if.legacy.in[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: Counter converted from bytes/s to bits/s. 32-bit counters may wrap at high throughput.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 63c637cd86f04973bf59827f382193be
        name: 'Interface {#IFNAME}: Outgoing traffic (32-bit fallback)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.16.{#SNMPINDEX}]
        key: uisp.if.legacy.out[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: Counter converted from bytes/s to bits/s. 32-bit counters may wrap at high throughput.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 72270240101c41a0b0d55a917dbe7e65
        name: 'Interface {#IFNAME}: Input errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}]
        key: uisp.if.in.errors[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: errors
      - uuid: 821802878634437f93860a9f5e39dcb5
        name: 'Interface {#IFNAME}: Output errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}]
        key: uisp.if.out.errors[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: errors
      - uuid: ce8c86a7bd5240ae95d85b3a19b18668
        name: 'Interface {#IFNAME}: Input discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}]
        key: uisp.if.in.discards[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: errors
      - uuid: c3b449839ecf4d4dbeb4d4fab6278ee4
        name: 'Interface {#IFNAME}: Output discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}]
        key: uisp.if.out.discards[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: errors
      graph_prototypes:
      - uuid: f67db366ef2c486082cb254e606d6f91
        name: 'Interface {#IFNAME}: Traffic (64-bit)'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Lite AP by SNMP
            key: uisp.if.hc.in[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Lite AP by SNMP
            key: uisp.if.hc.out[{#SNMPINDEX}]
      - uuid: 30b186c6be4046baa66ff437adf80a43
        name: 'Interface {#IFNAME}: Traffic (32-bit fallback)'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Lite AP by SNMP
            key: uisp.if.legacy.in[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Lite AP by SNMP
            key: uisp.if.legacy.out[{#SNMPINDEX}]
      - uuid: 671f210ad4294b8aadbf920d452dbd82
        name: 'Interface {#IFNAME}: Errors and discards'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Lite AP by SNMP
            key: uisp.if.in.errors[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Lite AP by SNMP
            key: uisp.if.out.errors[{#SNMPINDEX}]
        - sortorder: '2'
          color: 1A7BC5
          item:
            host: Ubiquiti Lite AP by SNMP
            key: uisp.if.in.discards[{#SNMPINDEX}]
        - sortorder: '3'
          color: 6C59DC
          item:
            host: Ubiquiti Lite AP by SNMP
            key: uisp.if.out.discards[{#SNMPINDEX}]
      trigger_prototypes:
      - uuid: 0616a821159442a697ebc9f6e5ae8224
        expression: '{$UISP.IF.ALERT:"{#IFNAME}"}=1 and last(/Ubiquiti Lite AP by SNMP/uisp.if.status[{#SNMPINDEX}])=2'
        name: 'Lite AP: Interface {#IFNAME} is down'
        priority: AVERAGE
        description: Opt-in interface alert. Set contextual {$UISP.IF.ALERT:"<interface>"}=1 for the intended physical uplink
          only.
        tags:
        - tag: scope
          value: availability
    - uuid: c0cebb6000594689a21ff63c601d585c
      name: airMAX wireless interface discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SSID},1.3.6.1.4.1.41112.1.4.5.1.2]
      key: uisp.airmax.wireless.discovery
      delay: 10m
      description: UBNT-AirMAX-MIB wireless status table. Ubiquiti documents ubntWlStatSignal as .1.3.6.1.4.1.41112.1.4.5.1.5.
      item_prototypes:
      - uuid: 1e0921f21ee342f09c6e0cd182d21a5d
        name: 'airMAX {#SSID}: Signal'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.5.1.5.{#SNMPINDEX}]
        key: uisp.airmax.signal[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: dBm
      - uuid: 13694ba38a9c4d6d926d1dcd55936ea8
        name: 'airMAX {#SSID}: RSSI'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.5.1.6.{#SNMPINDEX}]
        key: uisp.airmax.rssi[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: dBm
      - uuid: b7e275f046f649719d67a095ecb2d0a4
        name: 'airMAX {#SSID}: CCQ'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.5.1.7.{#SNMPINDEX}]
        key: uisp.airmax.ccq[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: '%'
      - uuid: 8cf68866927a4aceb06093ef61856333
        name: 'airMAX {#SSID}: Noise floor'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.5.1.8.{#SNMPINDEX}]
        key: uisp.airmax.noise[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: dBm
      - uuid: 0a6ed8313c7a4836a6404dd0933a8d18
        name: 'airMAX {#SSID}: TX rate'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.5.1.9.{#SNMPINDEX}]
        key: uisp.airmax.txrate[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
      - uuid: 2328013509a441c9933e8a20304ef50c
        name: 'airMAX {#SSID}: RX rate'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.5.1.10.{#SNMPINDEX}]
        key: uisp.airmax.rxrate[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
      - uuid: 3f7d621ff066419294b4beb8301f1162
        name: 'airMAX {#SSID}: Station count'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.5.1.15.{#SNMPINDEX}]
        key: uisp.airmax.stations[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
      graph_prototypes:
      - uuid: 066245e3a01943b094aa17c0011a1795
        name: 'airMAX {#SSID}: RF signal'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Lite AP by SNMP
            key: uisp.airmax.signal[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Lite AP by SNMP
            key: uisp.airmax.noise[{#SNMPINDEX}]
      - uuid: 95c64e1e33ea4a96bb149e59ec378099
        name: 'airMAX {#SSID}: Link rates'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Lite AP by SNMP
            key: uisp.airmax.txrate[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Lite AP by SNMP
            key: uisp.airmax.rxrate[{#SNMPINDEX}]
    - uuid: 646e3217dc73477db2766a677b23e1b6
      name: airMAX quality discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#AMQ},1.3.6.1.4.1.41112.1.4.6.1.3]
      key: uisp.airmax.quality.discovery
      delay: 10m
      item_prototypes:
      - uuid: f0feb9df21f4435c96263d58c01b0cec
        name: airMAX quality
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.6.1.3.{#SNMPINDEX}]
        key: uisp.airmax.quality[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: '%'
      - uuid: a130a791c4f7404ba3f6453e9b6e6cd2
        name: airMAX capacity
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.6.1.4.{#SNMPINDEX}]
        key: uisp.airmax.capacity[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: '%'
      - uuid: ece2bdc7f6a547cc9f5f269adfdbab0d
        name: airMAX airtime
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.4.6.1.7.{#SNMPINDEX}]
        key: uisp.airmax.airtime[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: '%'
        preprocessing:
        - type: MULTIPLIER
          parameters:
          - '0.1'
      graph_prototypes:
      - uuid: 6dc2fa0e627443469761e041f7525e14
        name: airMAX quality / capacity
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Lite AP by SNMP
            key: uisp.airmax.quality[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Lite AP by SNMP
            key: uisp.airmax.capacity[{#SNMPINDEX}]
        - sortorder: '2'
          color: 1A7BC5
          item:
            host: Ubiquiti Lite AP by SNMP
            key: uisp.airmax.airtime[{#SNMPINDEX}]
    tags:
    - tag: vendor
      value: Ubiquiti
    - tag: family
      value: airMAX
    - tag: model
      value: LAP-120
    - tag: role
      value: PtMP AP
    macros:
    - macro: '{$ICMP.LOSS.WARN}'
      value: '20'
      description: Packet-loss percent threshold
    - macro: '{$ICMP.RTT.WARN}'
      value: '0.15'
      description: Round-trip time threshold (seconds)
    - macro: '{$UISP.IF.MATCHES}'
      value: .*
      description: Regex filter for interface descriptions
    - macro: '{$UISP.IF.ALERT}'
      value: '0'
      description: Global interface-down alert is disabled. Use contextual {$UISP.IF.ALERT:"<physical-interface>"}=1 to enable
        only for intended ports.
    - macro: '{$UISP.RF.ALERT}'
      value: '0'
      description: Enable RF-link-down trigger only after confirming the private MIB/profile works on this device/firmware.
    valuemaps:
    - uuid: 4101452cb69b4836abbf2faeda793e2f
      name: IF-MIB ifOperStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
      - value: '4'
        newvalue: unknown
      - value: '5'
        newvalue: dormant
      - value: '6'
        newvalue: notPresent
      - value: '7'
        newvalue: lowerLayerDown
    - uuid: 5319833992fc4ca19b93f9d7bc2391d4
      name: IF-MIB ifAdminStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
  graphs:
  - uuid: 71d2bb93370f425bb72bc594c750b368
    name: 'Lite AP: ICMP latency'
    graph_items:
    - color: 199C0D
      item:
        host: Ubiquiti Lite AP by SNMP
        key: icmppingsec
  - uuid: 86e5c7f9ff1e4a18aae900f1656ed1b1
    name: 'Lite AP: ICMP packet loss'
    graph_items:
    - color: 199C0D
      item:
        host: Ubiquiti Lite AP by SNMP
        key: icmppingloss
  - uuid: fae2052739b64722b30b5546dd02d78a
    name: 'Lite AP: SNMP agent uptime'
    graph_items:
    - color: 199C0D
      item:
        host: Ubiquiti Lite AP by SNMP
        key: uisp.system.uptime
