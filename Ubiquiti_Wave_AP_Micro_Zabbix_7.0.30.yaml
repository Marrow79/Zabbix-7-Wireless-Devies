zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: d565c1d31c3c4255a1cda01969a285d9
    template: Ubiquiti Wave AP Micro by SNMP
    name: Ubiquiti Wave AP Micro by SNMP
    description: 'Zabbix 7.0.30 template for Ubiquiti Wave AP Micro (Wave-AP-Micro). Role: PtMP AP. SNMP assessment: Yes.
      Wave product tech specs list SNMP. UI-AF60-MIB is included as a best-effort private metric profile. AF60 private OID
      coverage on Wave firmware is not guaranteed; standard SNMP and IF-MIB remain available where exposed. SNMP credentials/interface
      are configured at the Zabbix host, not in this template.'
    groups:
    - name: Templates/Network devices
    items:
    - uuid: e1dea082cc3c466d8c2463d5f0e4d632
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      delay: 1m
      history: 7d
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 8612ff9b07374493886bde0bdec20d99
        expression: max(/Ubiquiti Wave AP Micro by SNMP/icmpping,#3)=0
        name: 'Wave AP Micro: Unavailable by ICMP ping'
        priority: HIGH
        description: Three consecutive ICMP checks failed.
        tags:
        - tag: scope
          value: availability
    - uuid: 73e4bc7090c8460cb985def5b55a4307
      name: ICMP packet loss
      type: SIMPLE
      key: icmppingloss
      delay: 1m
      value_type: FLOAT
      units: '%'
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: daa7a46800d74f199b93d34d1fcb47e4
        expression: min(/Ubiquiti Wave AP Micro by SNMP/icmppingloss,5m)>{$ICMP.LOSS.WARN} and min(/Ubiquiti Wave AP Micro
          by SNMP/icmppingloss,5m)<100
        name: 'Wave AP Micro: High ICMP packet loss'
        priority: WARNING
        description: Packet loss exceeded the warning threshold for 5 minutes.
        tags:
        - tag: scope
          value: performance
    - uuid: 0634c39c3d894cc78e05b962db9b18de
      name: ICMP response time
      type: SIMPLE
      key: icmppingsec
      delay: 1m
      value_type: FLOAT
      units: s
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 71a875755ed24f149a3c31542c869432
        expression: avg(/Ubiquiti Wave AP Micro by SNMP/icmppingsec,5m)>{$ICMP.RTT.WARN}
        name: 'Wave AP Micro: High ICMP response time'
        priority: WARNING
        description: Average round-trip time exceeded threshold for 5 minutes.
        tags:
        - tag: scope
          value: performance
    - uuid: e0edd66e896b4e4a871ee7b3b0cf5b8e
      name: SNMP network uptime
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.3.0]
      key: uisp.system.uptime
      delay: 1m
      units: uptime
      description: sysUpTime (TimeTicks / 100); measures SNMP agent uptime, not guaranteed hardware uptime.
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 83b490f8733548b3ab3566d0c5869156
        expression: nodata(/Ubiquiti Wave AP Micro by SNMP/uisp.system.uptime,15m)=1 and last(/Ubiquiti Wave AP Micro by SNMP/icmpping)=1
        name: 'Wave AP Micro: SNMP stops responding while ping succeeds'
        priority: AVERAGE
        description: Device replies to ping but sysUpTime polling has had no data for 15 minutes; check SNMP credentials/firewall.
        tags:
        - tag: scope
          value: availability
    - uuid: fe7bcb3a16fa4171b0bd269d0b238c24
      name: SNMP system description
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.1.0]
      key: uisp.system.description
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: bb9c9260ac274ede811aaf0438d7d316
      name: SNMP system object ID
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.2.0]
      key: uisp.system.objectid
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 20e4a9c4be33456f9118ea4c6cb0f545
      name: SNMP system name
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.5.0]
      key: uisp.system.name
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 516bab402ca345b4bb3d4f5b9ad17a86
      name: SNMP system location
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.6.0]
      key: uisp.system.location
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: b34abe37a7e1464c9e4952cc8b21a9a4
      name: SNMP system contact
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.4.0]
      key: uisp.system.contact
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 6962aa1df7764e54af7eeda0df807dae
      name: AF60/Wave device model
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.2.2.0]
      key: uisp.af60.model
      delay: 10m
      value_type: CHAR
      tags:
      - tag: component
        value: wireless
    - uuid: 01eb530c83ad45439376fcb04ef2e4b6
      name: AF60/Wave firmware version
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.2.4.0]
      key: uisp.af60.firmware
      delay: 10m
      value_type: CHAR
      tags:
      - tag: component
        value: wireless
    - uuid: f53b5c411ca043a391129e392c9c3340
      name: AF60/Wave memory usage
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.2.5.0]
      key: uisp.af60.memory
      delay: 2m
      units: '%'
      tags:
      - tag: component
        value: wireless
    - uuid: 7fb69410bbcf4aa3937dc37417ce85b5
      name: AF60/Wave CPU usage
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.2.6.0]
      key: uisp.af60.cpu
      delay: 2m
      units: '%'
      tags:
      - tag: component
        value: wireless
    - uuid: da7f9ab858a141c39dcbaea2c2e17da9
      name: AF60/Wave configured frequency
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.1.2.0]
      key: uisp.af60.frequency
      delay: 2m
      units: MHz
      tags:
      - tag: component
        value: wireless
    discovery_rules:
    - uuid: 986ccba6021c4333ab08a8711351014c
      name: Network interface discovery (IF-MIB)
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFNAME},1.3.6.1.2.1.2.2.1.2,{#IFADMIN},1.3.6.1.2.1.2.2.1.7]
      key: uisp.if.discovery
      delay: 1h
      description: Standard IF-MIB/IF-X-MIB discovery. High-capacity 64-bit counters may be unsupported on older devices;
        classic 32-bit counters are included as fallback.
      filter:
        conditions:
        - macro: '{#IFNAME}'
          value: '{$UISP.IF.MATCHES}'
      item_prototypes:
      - uuid: aaec008879e5421c8076ba2c41e46944
        name: 'Interface {#IFNAME}: Operational status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]
        key: uisp.if.status[{#SNMPINDEX}]
        delay: 2m
        valuemap:
          name: IF-MIB ifOperStatus
        tags:
        - tag: component
          value: network
      - uuid: c7261674800f4223bf1da44d8b124163
        name: 'Interface {#IFNAME}: Admin status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}]
        key: uisp.if.admin[{#SNMPINDEX}]
        delay: 5m
        valuemap:
          name: IF-MIB ifAdminStatus
        tags:
        - tag: component
          value: network
      - uuid: d21a3d48e4464ab7b7be9d260f6fa7fd
        name: 'Interface {#IFNAME}: Incoming traffic (64-bit)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}]
        key: uisp.if.hc.in[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: 64-bit IF-MIB high-capacity octet counter, suitable for multi-gigabit uplinks.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: ca8b6ad034bf405e82f965ede6c2e9a6
        name: 'Interface {#IFNAME}: Outgoing traffic (64-bit)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}]
        key: uisp.if.hc.out[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: 64-bit IF-MIB high-capacity octet counter, suitable for multi-gigabit uplinks.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 39aafda5503748d3b12521c43b039139
        name: 'Interface {#IFNAME}: Incoming traffic (32-bit fallback)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.10.{#SNMPINDEX}]
        key: uisp.if.legacy.in[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: Counter converted from bytes/s to bits/s. 32-bit counters may wrap at high throughput.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 64b5287c901342b99d6c0f6bd47d5c0e
        name: 'Interface {#IFNAME}: Outgoing traffic (32-bit fallback)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.16.{#SNMPINDEX}]
        key: uisp.if.legacy.out[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: Counter converted from bytes/s to bits/s. 32-bit counters may wrap at high throughput.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 22f9c90735f847c195809c9ae18fc58f
        name: 'Interface {#IFNAME}: Input errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}]
        key: uisp.if.in.errors[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: errors
      - uuid: 3d4d5ffbd4e84858934d767bdbd89d62
        name: 'Interface {#IFNAME}: Output errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}]
        key: uisp.if.out.errors[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: errors
      - uuid: e709c296ed794c4d813099bd16f0fe7d
        name: 'Interface {#IFNAME}: Input discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}]
        key: uisp.if.in.discards[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: errors
      - uuid: 2b633a5764f64087b16aa0fdabc4d804
        name: 'Interface {#IFNAME}: Output discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}]
        key: uisp.if.out.discards[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: errors
      graph_prototypes:
      - uuid: 56c25e3eac25481fa62393c454199f5a
        name: 'Interface {#IFNAME}: Traffic (64-bit)'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Wave AP Micro by SNMP
            key: uisp.if.hc.in[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Wave AP Micro by SNMP
            key: uisp.if.hc.out[{#SNMPINDEX}]
      - uuid: 9063fc8ff0be474abb3508fbf4021901
        name: 'Interface {#IFNAME}: Traffic (32-bit fallback)'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Wave AP Micro by SNMP
            key: uisp.if.legacy.in[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Wave AP Micro by SNMP
            key: uisp.if.legacy.out[{#SNMPINDEX}]
      - uuid: 652debf92005457587ae088b20bca067
        name: 'Interface {#IFNAME}: Errors and discards'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Wave AP Micro by SNMP
            key: uisp.if.in.errors[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Wave AP Micro by SNMP
            key: uisp.if.out.errors[{#SNMPINDEX}]
        - sortorder: '2'
          color: 1A7BC5
          item:
            host: Ubiquiti Wave AP Micro by SNMP
            key: uisp.if.in.discards[{#SNMPINDEX}]
        - sortorder: '3'
          color: 6C59DC
          item:
            host: Ubiquiti Wave AP Micro by SNMP
            key: uisp.if.out.discards[{#SNMPINDEX}]
      trigger_prototypes:
      - uuid: d99fd0da1b674bc08c3551d24e1c7731
        expression: '{$UISP.IF.ALERT:"{#IFNAME}"}=1 and last(/Ubiquiti Wave AP Micro by SNMP/uisp.if.status[{#SNMPINDEX}])=2'
        name: 'Wave AP Micro: Interface {#IFNAME} is down'
        priority: AVERAGE
        description: Opt-in interface alert. Set contextual {$UISP.IF.ALERT:"<interface>"}=1 for the intended physical uplink
          only.
        tags:
        - tag: scope
          value: availability
    - uuid: 09773661349b4321ab94610c87265133
      name: AF60/Wave remote station discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#REMOTE},1.3.6.1.4.1.41112.1.11.1.3.1.14]
      key: uisp.af60.station.discovery
      delay: 10m
      description: UI-AF60-MIB remote station table. On Wave models the private MIB may be partial or firmware-dependent;
        disable this rule if unsupported.
      item_prototypes:
      - uuid: d52ecdadd0a844e4953a7c29757a7b42
        name: 'AF60/Wave {#REMOTE}: Local RSSI'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.3.1.3.{#SNMPINDEX}]
        key: uisp.af60.rssi[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: dBm
      - uuid: 220d83c0d3e64613a0b7de5cdb0ac314
        name: 'AF60/Wave {#REMOTE}: Local SNR'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.3.1.4.{#SNMPINDEX}]
        key: uisp.af60.snr[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: dB
      - uuid: 3045dd52b31740d8a9111d2bb2da4b3c
        name: 'AF60/Wave {#REMOTE}: TX capacity'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.3.1.7.{#SNMPINDEX}]
        key: uisp.af60.txcap[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: Kbps
      - uuid: cda85486591e44b3b7a5a9fa84c26e23
        name: 'AF60/Wave {#REMOTE}: RX capacity'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.3.1.8.{#SNMPINDEX}]
        key: uisp.af60.rxcap[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: Kbps
      - uuid: 4481ada5b44b406ab8256f880be1d2a7
        name: 'AF60/Wave {#REMOTE}: TX throughput'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.3.1.11.{#SNMPINDEX}]
        key: uisp.af60.txthrough[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: Kbps
      - uuid: 2577f80907ba444b89e2151dda19d37d
        name: 'AF60/Wave {#REMOTE}: RX throughput'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.3.1.12.{#SNMPINDEX}]
        key: uisp.af60.rxthrough[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: Kbps
      - uuid: f4c3f8dca88e46eca1c8c364e1ba88ca
        name: 'AF60/Wave {#REMOTE}: Distance'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.3.1.15.{#SNMPINDEX}]
        key: uisp.af60.distance[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: m
      - uuid: 8feb3012591848559fb879f6774ae086
        name: 'AF60/Wave {#REMOTE}: Remote RSSI'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.3.1.18.{#SNMPINDEX}]
        key: uisp.af60.remote.rssi[{#SNMPINDEX}]
        delay: 2m
        tags:
        - tag: component
          value: wireless
        units: dBm
      graph_prototypes:
      - uuid: 511bb8ce9df547678ca2407862b4c0f9
        name: 'AF60/Wave {#REMOTE}: Capacity'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Wave AP Micro by SNMP
            key: uisp.af60.txcap[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Wave AP Micro by SNMP
            key: uisp.af60.rxcap[{#SNMPINDEX}]
      - uuid: 8580e9429d984902bb93cd3e7cb4c99b
        name: 'AF60/Wave {#REMOTE}: Throughput'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Wave AP Micro by SNMP
            key: uisp.af60.txthrough[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Wave AP Micro by SNMP
            key: uisp.af60.rxthrough[{#SNMPINDEX}]
      - uuid: 581144aaf5d84a1aaac7e7fd3fe5abf7
        name: 'AF60/Wave {#REMOTE}: Signal'
        graph_items:
        - color: 199C0D
          item:
            host: Ubiquiti Wave AP Micro by SNMP
            key: uisp.af60.rssi[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ubiquiti Wave AP Micro by SNMP
            key: uisp.af60.remote.rssi[{#SNMPINDEX}]
    tags:
    - tag: vendor
      value: Ubiquiti
    - tag: family
      value: Wave
    - tag: model
      value: Wave-AP-Micro
    - tag: role
      value: PtMP AP
    macros:
    - macro: '{$ICMP.LOSS.WARN}'
      value: '20'
      description: Packet-loss percent threshold
    - macro: '{$ICMP.RTT.WARN}'
      value: '0.15'
      description: Round-trip time threshold (seconds)
    - macro: '{$UISP.IF.MATCHES}'
      value: .*
      description: Regex filter for interface descriptions
    - macro: '{$UISP.IF.ALERT}'
      value: '0'
      description: Global interface-down alert is disabled. Use contextual {$UISP.IF.ALERT:"<physical-interface>"}=1 to enable
        only for intended ports.
    - macro: '{$UISP.RF.ALERT}'
      value: '0'
      description: Enable RF-link-down trigger only after confirming the private MIB/profile works on this device/firmware.
    valuemaps:
    - uuid: 5a187d01ce174b2599026b47d8af941b
      name: IF-MIB ifOperStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
      - value: '4'
        newvalue: unknown
      - value: '5'
        newvalue: dormant
      - value: '6'
        newvalue: notPresent
      - value: '7'
        newvalue: lowerLayerDown
    - uuid: a42f0e43c71048b3ac465756233fae6c
      name: IF-MIB ifAdminStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
  graphs:
  - uuid: a846e574d2ab450e953dcb8414c2171a
    name: 'Wave AP Micro: ICMP latency'
    graph_items:
    - color: 199C0D
      item:
        host: Ubiquiti Wave AP Micro by SNMP
        key: icmppingsec
  - uuid: ec6223cb68d142a8a621df37546a3767
    name: 'Wave AP Micro: ICMP packet loss'
    graph_items:
    - color: 199C0D
      item:
        host: Ubiquiti Wave AP Micro by SNMP
        key: icmppingloss
  - uuid: 5ed1f3dee9d0480697ca37082f509bd9
    name: 'Wave AP Micro: SNMP agent uptime'
    graph_items:
    - color: 199C0D
      item:
        host: Ubiquiti Wave AP Micro by SNMP
        key: uisp.system.uptime
