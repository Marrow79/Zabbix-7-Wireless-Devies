    - macro: '{$ICMP.LOSS.WARN}'
      value: '20'
      description: Packet-loss percent threshold
    - macro: '{$ICMP.RTT.WARN}'
      value: '0.15'
      description: Round-trip time threshold (seconds)
    - macro: '{$NANOHD.IF.MATCHES}'
      value: .*
      description: Regex filter for interface descriptions
    - macro: '{$NANOHD.IF.ALERT}'
      value: '0'
      description: Turn on down alerts per interface by host-level contextual macro.
    - macro: '{$NANOHD.IF.ALERT:"eth0"}'
      value: '1'
      description: Enable link-down alert for the common physical Ethernet interface eth0. Confirm actual interface
        names on your nanoHD and change the context macro if needed.
    - macro: '{$NANOHD.RADIO.UTIL.WARN}'
      value: '85'
      description: 10-minute average radio utilization threshold (%)
