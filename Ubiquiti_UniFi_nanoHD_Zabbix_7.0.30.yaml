    - uuid: 59cffb3ec07f43b1881c41eb3a811cc3
      name: TruthValue (1=true, 2=false)
      mappings:
      - value: '1'
        newvalue: 'True'
      - value: '2'
        newvalue: 'False'
    - uuid: 24fb567377a047eea19bebc2a3b54f07
      name: IF-MIB ifOperStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
      - value: '4'
        newvalue: unknown
      - value: '5'
        newvalue: dormant
      - value: '6'
        newvalue: notPresent
      - value: '7'
        newvalue: lowerLayerDown
    - uuid: c13d5856cc464e2a9aadc7ea51477649
      name: IF-MIB ifAdminStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
